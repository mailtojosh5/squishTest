<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squish Automation Report</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Clash+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #05070f;
  --bg2: #080c18;
  --surface: #0d1224;
  --surface2: #121930;
  --surface3: #1a2340;
  --border: rgba(99,120,200,0.12);
  --border2: rgba(99,120,200,0.22);

  --pass: #00f5a0;
  --fail: #ff3366;
  --skip: #ffcc00;
  --error: #ff6b35;
  --log: #4fc3f7;

  --accent: #6366f1;
  --accent2: #8b5cf6;
  --glow: rgba(99,102,241,0.4);

  --text: #e8eaf6;
  --text2: #9ba8c9;
  --muted: #4a5578;

  --pass-glow: rgba(0,245,160,0.3);
  --fail-glow: rgba(255,51,102,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ───── BACKGROUND ───── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(99,102,241,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 110%, rgba(139,92,246,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(0,245,160,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* ───── FLOATING ORBS ───── */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: orbFloat linear infinite;
  opacity: 0.4;
}
.orb1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.3), transparent 70%); top: -150px; left: -100px; animation-duration: 20s; }
.orb2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%); bottom: -100px; right: -80px; animation-duration: 25s; animation-direction: reverse; }
.orb3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,245,160,0.15), transparent 70%); top: 40%; left: 60%; animation-duration: 18s; }

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -40px) scale(1.05); }
  66% { transform: translate(-20px, 20px) scale(0.95); }
}

/* ───── LAYOUT ───── */
.container {
  max-width: 1380px;
  margin: auto;
  padding: 50px 28px 100px;
  position: relative;
  z-index: 1;
}

/* ───── HEADER ───── */
header {
  text-align: center;
  margin-bottom: 60px;
  animation: slideDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.badge-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 16px;
  border: 1px solid var(--border2);
  border-radius: 100px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text2);
  background: rgba(13,18,36,0.8);
  backdrop-filter: blur(12px);
}

.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pass);
  box-shadow: 0 0 8px var(--pass);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--pass); }
  50% { opacity: 0.5; box-shadow: 0 0 16px var(--pass), 0 0 30px var(--pass); }
}

h1 {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -2px;
  margin-bottom: 18px;
}

.h1-line1 {
  display: block;
  color: var(--text);
}

.h1-line2 {
  display: block;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 40%, var(--pass) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* ───── STAT CARDS ───── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
  animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.stat-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--card-glow, transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
  border-radius: inherit;
}

.stat-card:hover { transform: translateY(-5px) scale(1.02); }
.stat-card:hover::before { opacity: 1; }

.stat-card.total  { --card-glow: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.15), transparent 70%); }
.stat-card.pass   { --card-glow: radial-gradient(circle at 50% 0%, rgba(0,245,160,0.12), transparent 70%); }
.stat-card.fail   { --card-glow: radial-gradient(circle at 50% 0%, rgba(255,51,102,0.12), transparent 70%); }
.stat-card.skip   { --card-glow: radial-gradient(circle at 50% 0%, rgba(255,204,0,0.10), transparent 70%); }
.stat-card.error  { --card-glow: radial-gradient(circle at 50% 0%, rgba(255,107,53,0.12), transparent 70%); }

.stat-card:hover.total  { border-color: rgba(99,102,241,0.5); box-shadow: 0 20px 60px rgba(99,102,241,0.15); }
.stat-card:hover.pass   { border-color: rgba(0,245,160,0.4); box-shadow: 0 20px 60px rgba(0,245,160,0.12); }
.stat-card:hover.fail   { border-color: rgba(255,51,102,0.4); box-shadow: 0 20px 60px rgba(255,51,102,0.12); }
.stat-card:hover.skip   { border-color: rgba(255,204,0,0.35); box-shadow: 0 20px 60px rgba(255,204,0,0.10); }
.stat-card:hover.error  { border-color: rgba(255,107,53,0.4); box-shadow: 0 20px 60px rgba(255,107,53,0.12); }

.stat-icon {
  font-size: 24px;
  margin-bottom: 10px;
  display: block;
}

.stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 8px;
  transition: all 0.3s ease;
}

.total .stat-num  { color: var(--accent); }
.pass .stat-num   { color: var(--pass); text-shadow: 0 0 20px var(--pass-glow); }
.fail .stat-num   { color: var(--fail); text-shadow: 0 0 20px var(--fail-glow); }
.skip .stat-num   { color: var(--skip); }
.error .stat-num  { color: var(--error); }

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--muted);
  font-weight: 500;
}

.stat-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  border-radius: 0 0 18px 18px;
  transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
  width: 0;
}

.total .stat-bar  { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.pass .stat-bar   { background: linear-gradient(90deg, var(--pass), #00c896); }
.fail .stat-bar   { background: linear-gradient(90deg, var(--fail), #ff6b9d); }
.skip .stat-bar   { background: linear-gradient(90deg, var(--skip), #ffaa00); }
.error .stat-bar  { background: linear-gradient(90deg, var(--error), #ff9a6b); }

/* ───── CHARTS SECTION ───── */
.charts-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}

.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
}

.chart-card::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px; right: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  opacity: 0.6;
}

.chart-card-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--muted);
  margin-bottom: 30px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── DONUT CHART ── */
.donut-layout {
  display: flex;
  align-items: center;
  gap: 36px;
}

.donut-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  flex-shrink: 0;
}

.donut-wrap svg {
  transform: rotate(-90deg);
  filter: drop-shadow(0 0 12px rgba(99,102,241,0.2));
}

.donut-bg {
  fill: none;
  stroke: var(--surface3);
  stroke-width: 26;
}

.donut-seg {
  fill: none;
  stroke-width: 26;
  stroke-linecap: round;
  transition: stroke-dasharray 1.4s cubic-bezier(0.16, 1, 0.3, 1),
              stroke-dashoffset 1.4s cubic-bezier(0.16, 1, 0.3, 1),
              opacity 0.3s;
}

.donut-seg:hover { opacity: 0.8; stroke-width: 30; }

.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.donut-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--pass);
  text-shadow: 0 0 24px var(--pass-glow);
  line-height: 1;
}

.donut-lbl {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  margin-top: 4px;
}

.donut-legend {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}

.legend-name {
  flex: 1;
  font-size: 13px;
  color: var(--text2);
  font-weight: 500;
}

.legend-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
}

.legend-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  width: 38px;
  text-align: right;
}

/* ── PIE CHART ── */
.pie-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  flex-shrink: 0;
}

.pie-wrap svg {
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
  overflow: visible;
}

.pie-slice {
  transform-origin: 100px 100px;
  transition: transform 0.2s ease, opacity 0.2s ease;
  cursor: pointer;
}

.pie-slice:hover {
  transform: scale(1.06);
  filter: brightness(1.2);
}

.pie-label-line {
  stroke: var(--border2);
  stroke-width: 1;
  fill: none;
}

.pie-label-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  fill: var(--text2);
}

.pie-layout {
  display: flex;
  align-items: center;
  gap: 36px;
}

/* ───── SECTION TITLE ───── */
.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3.5px;
  color: var(--muted);
  margin-bottom: 20px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border2), transparent);
}

/* ───── SUITE CARDS ───── */
.suite-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 20px;
  animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  transition: border-color 0.3s ease;
}

.suite-card:hover { border-color: var(--border2); }

.suite-header {
  background: linear-gradient(135deg, var(--surface2) 0%, var(--surface3) 100%);
  padding: 20px 26px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s ease;
  position: relative;
}

.suite-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: var(--border);
}

.suite-header:hover { background: linear-gradient(135deg, var(--surface3) 0%, #1e2a48 100%); }

.suite-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.suite-info { flex: 1; }

.suite-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.suite-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}

.suite-chevron {
  color: var(--muted);
  font-size: 18px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.suite-chevron.open { transform: rotate(180deg); }

.suite-body {
  padding: 20px;
}

.collapsible { display: none; }
.collapsible.open { display: block; }

/* ───── TEST CASES ───── */
.testcase {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.testcase:hover { border-color: var(--border2); }

.testcase-header {
  padding: 14px 18px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
}

.tc-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-pass  { background: var(--pass); box-shadow: 0 0 8px var(--pass-glow); }
.dot-fail  { background: var(--fail); box-shadow: 0 0 8px var(--fail-glow); }
.dot-skip  { background: var(--skip); }
.dot-error { background: var(--error); }

.tc-name {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text2);
}

.tc-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 100px;
  letter-spacing: 1.5px;
}

.badge-pass  { background: rgba(0,245,160,0.12); color: var(--pass); border: 1px solid rgba(0,245,160,0.25); }
.badge-fail  { background: rgba(255,51,102,0.12); color: var(--fail); border: 1px solid rgba(255,51,102,0.25); }
.badge-skip  { background: rgba(255,204,0,0.10); color: var(--skip); border: 1px solid rgba(255,204,0,0.2); }
.badge-error { background: rgba(255,107,53,0.12); color: var(--error); border: 1px solid rgba(255,107,53,0.25); }

.tc-chevron {
  color: var(--muted);
  font-size: 14px;
  transition: transform 0.25s ease;
}

.tc-chevron.open { transform: rotate(180deg); }

.testcase-body { padding: 16px; background: var(--bg); }

.msg-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.msg-item {
  padding: 12px 16px;
  border-radius: 8px;
  border-left: 3px solid var(--border);
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text2);
  line-height: 1.6;
  transition: transform 0.2s ease;
}

.msg-item:hover { transform: translateX(4px); }
.msg-item.pass  { border-left-color: var(--pass); background: rgba(0,245,160,0.04); }
.msg-item.fail  { border-left-color: var(--fail); background: rgba(255,51,102,0.04); color: #ffb3c1; }
.msg-item.log   { border-left-color: var(--log);  background: rgba(79,195,247,0.04); }
.msg-item.error { border-left-color: var(--error);background: rgba(255,107,53,0.04); color: #ffc4aa; }

.msg-tag {
  display: inline-block;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 4px;
  margin-bottom: 5px;
  font-weight: 600;
  letter-spacing: 1px;
}

.msg-item.pass  .msg-tag { background: rgba(0,245,160,0.15); color: var(--pass); }
.msg-item.fail  .msg-tag { background: rgba(255,51,102,0.15); color: var(--fail); }
.msg-item.log   .msg-tag { background: rgba(79,195,247,0.15); color: var(--log); }
.msg-item.error .msg-tag { background: rgba(255,107,53,0.15); color: var(--error); }

/* ───── PROGRESS BAR ───── */
.progress-track {
  height: 6px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 32px;
}

.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--pass));
  width: 0;
  transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 40px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
  animation: shimmer 2s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

/* ───── LOADING ───── */
#loading {
  text-align: center;
  padding: 140px 40px;
}

.loader {
  width: 60px;
  height: 60px;
  position: relative;
  margin: 0 auto 28px;
}

.loader-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  animation: spin 1.5s linear infinite;
}

.loader-ring:nth-child(1) { border-top-color: var(--accent); animation-duration: 1.5s; }
.loader-ring:nth-child(2) { border-right-color: var(--pass); animation-duration: 2s; animation-direction: reverse; inset: 8px; }
.loader-ring:nth-child(3) { border-bottom-color: var(--accent2); animation-duration: 2.5s; inset: 16px; }

@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ───── ERROR ───── */
#error-msg {
  display: none;
  text-align: center;
  padding: 100px 40px;
}

.error-box {
  display: inline-block;
  background: rgba(255,51,102,0.08);
  border: 1px solid rgba(255,51,102,0.25);
  color: var(--fail);
  padding: 28px 36px;
  border-radius: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

#report { display: none; }

/* ───── ANIMATIONS ───── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.delay-1 { animation-delay: 0.05s; }
.delay-2 { animation-delay: 0.10s; }
.delay-3 { animation-delay: 0.15s; }
.delay-4 { animation-delay: 0.20s; }
.delay-5 { animation-delay: 0.25s; }

/* ───── RESPONSIVE ───── */
@media (max-width: 900px) {
  .summary-grid { grid-template-columns: repeat(3, 1fr); }
  .charts-wrapper { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .donut-layout, .pie-layout { flex-direction: column; }
}

/* ───── TOOLTIP ───── */
.tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 8px 14px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text);
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.2s ease;
  white-space: nowrap;
}

.tooltip.visible { opacity: 1; }

/* ───── SCROLLBAR ───── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="tooltip" id="tooltip"></div>

<div class="container">

  <header>
    <div class="badge-row">
      <div class="status-pill">
        <span class="pulse-dot"></span>
        SQUISH AUTOMATION REPORT
      </div>
    </div>
    <h1>
      <span class="h1-line1">Test Execution</span>
      <span class="h1-line2">Results</span>
    </h1>
    <p class="subtitle" id="report-subtitle">Loading report…</p>
  </header>

  <div id="loading">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
    </div>
    <div class="loader-text">LOADING RESULTS</div>
  </div>

  <div id="error-msg">
    <div class="error-box">⚠ Failed to load results.json</div>
  </div>

  <div id="report"></div>

</div>

<script>
const JSON_FILE = 'results.json';

/* ── DEMO DATA (used when results.json absent) ── */
const DEMO_DATA = {
  tests: [{
    name: "Login Module",
    start: new Date().toISOString(),
    tests: [
      { name: "TC_Login_001", tests: [
        { result:"PASS", text:"Verify login with valid credentials" },
        { result:"PASS", text:"Check dashboard redirect after login" },
        { result:"PASS", text:"Validate session token created" }
      ]},
      { name: "TC_Login_002", tests: [
        { result:"FAIL", text:"Login with invalid password should show error" },
        { result:"PASS", text:"Lockout after 3 failed attempts" }
      ]},
      { name: "TC_Login_003", isSkipped:true, tests: [
        { result:"PASS", text:"SSO login flow — skipped on CI" }
      ]}
    ]
  },{
    name: "Dashboard Tests",
    start: new Date().toISOString(),
    tests: [
      { name: "TC_Dash_001", tests: [
        { result:"PASS", text:"Widget load time < 2s" },
        { result:"PASS", text:"Chart data renders correctly" },
        { result:"PASS", text:"Filter panel responds to input" }
      ]},
      { name: "TC_Dash_002", tests: [
        { result:"ERROR", text:"Timeout waiting for analytics endpoint" },
        { result:"FAIL",  text:"Export CSV button not found in DOM" }
      ]}
    ]
  },{
    name: "API Integration",
    start: new Date().toISOString(),
    tests: [
      { name: "TC_API_001", tests: [
        { result:"PASS", text:"GET /users returns 200" },
        { result:"PASS", text:"POST /users creates record" },
        { result:"PASS", text:"DELETE /users removes record" },
        { result:"PASS", text:"Auth header validated correctly" }
      ]},
      { name: "TC_API_002", tests: [
        { result:"PASS", text:"Rate limiting returns 429 after 100 req" },
        { result:"FAIL", text:"PATCH /users/profile missing validation" }
      ]},
      { name: "TC_API_003", isSkipped:true, tests: [
        { result:"PASS", text:"Webhook integration test — pending env" }
      ]}
    ]
  }]
};

/* ── UTILS ── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fmtDate(d){ try{ return new Date(d).toLocaleString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return String(d); } }

function analyzeTests(tests){
  const s={pass:0,fail:0,skip:0,error:0};
  function walk(arr){
    if(!arr) return;
    for(const t of arr){
      if(t.result==='PASS') s.pass++;
      else if(t.result==='FAIL') s.fail++;
      else if(t.result==='ERROR') s.error++;
      else if(t.isSkipped) s.skip++;
      if(t.tests) walk(t.tests);
    }
  }
  walk(tests);
  return s;
}

/* ── TOGGLE ── */
function toggleCollapse(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle('open');
  const chevron = document.getElementById('chev-'+id);
  if(chevron) chevron.classList.toggle('open');
}

/* ── TOOLTIP ── */
const ttEl = document.getElementById('tooltip');
function showTT(e, txt){
  ttEl.textContent = txt;
  ttEl.classList.add('visible');
  moveTT(e);
}
function moveTT(e){
  ttEl.style.left = (e.clientX + 14) + 'px';
  ttEl.style.top  = (e.clientY - 12) + 'px';
}
function hideTT(){ ttEl.classList.remove('visible'); }

/* ── ANIMATED COUNTER ── */
function animateCount(el, target, duration){
  const start = performance.now();
  function step(now){
    const p = Math.min((now-start)/duration, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(ease * target);
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── DONUT CHART ── */
function buildDonut(pass, fail, skip, error, total, passRate){
  if(total===0) return `<div style="color:var(--muted);font-size:12px;text-align:center;padding:40px">No test data</div>`;

  const r = 78, cx = 100, cy = 100;
  const circ = 2 * Math.PI * r;
  const segs = [
    { val: pass,  color: '#00f5a0', label: 'Passed',  id: 'ds-pass'  },
    { val: fail,  color: '#ff3366', label: 'Failed',  id: 'ds-fail'  },
    { val: error, color: '#ff6b35', label: 'Errors',  id: 'ds-error' },
    { val: skip,  color: '#ffcc00', label: 'Skipped', id: 'ds-skip'  }
  ].filter(s => s.val > 0);

  const circlesSVG = segs.map(s => `
    <circle id="${s.id}" class="donut-seg" cx="${cx}" cy="${cy}" r="${r}"
      stroke="${s.color}"
      stroke-dasharray="0 ${circ}"
      stroke-dashoffset="0"
      data-label="${s.label}: ${s.val} (${Math.round(s.val/total*100)}%)"
    />`).join('');

  const legendHTML = segs.map(s => `
    <div class="legend-row">
      <div class="legend-swatch" style="background:${s.color}"></div>
      <div class="legend-name">${s.label}</div>
      <div class="legend-val" style="color:${s.color}">${s.val}</div>
      <div class="legend-pct">${Math.round(s.val/total*100)}%</div>
    </div>`).join('');

  return `
  <div class="donut-layout">
    <div class="donut-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle class="donut-bg" cx="${cx}" cy="${cy}" r="${r}"/>
        ${circlesSVG}
      </svg>
      <div class="donut-center">
        <div class="donut-pct" id="donut-pct-val">${passRate}%</div>
        <div class="donut-lbl">PASS RATE</div>
      </div>
    </div>
    <div class="donut-legend">${legendHTML}</div>
  </div>`;
}

function animateDonut(pass, fail, skip, error, total){
  if(total===0) return;
  const r = 78;
  const circ = 2 * Math.PI * r;
  const segs = [
    { val: pass,  id: 'ds-pass',  color: '#00f5a0', label: 'Passed'  },
    { val: fail,  id: 'ds-fail',  color: '#ff3366', label: 'Failed'  },
    { val: error, id: 'ds-error', color: '#ff6b35', label: 'Errors'  },
    { val: skip,  id: 'ds-skip',  color: '#ffcc00', label: 'Skipped' }
  ].filter(s => s.val > 0);

  let offset = 0;
  segs.forEach(seg => {
    const el = document.getElementById(seg.id);
    if(!el) return;
    const dash = (seg.val / total) * circ;
    const gap  = circ - dash;
    el.style.strokeDasharray  = `${dash} ${gap}`;
    el.style.strokeDashoffset = -offset;
    offset += dash;

    el.addEventListener('mouseenter', e => showTT(e, seg.label + ': ' + seg.val + ' (' + Math.round(seg.val/total*100) + '%)'));
    el.addEventListener('mousemove',  moveTT);
    el.addEventListener('mouseleave', hideTT);
  });
}

/* ── PIE CHART ── */
function buildPie(pass, fail, skip, error, total){
  if(total===0) return ``;

  const cx = 100, cy = 100, r = 90;
  const slices = [
    { val: pass,  color: '#00f5a0', label: 'Pass',   glow: 'rgba(0,245,160,0.5)'  },
    { val: fail,  color: '#ff3366', label: 'Fail',   glow: 'rgba(255,51,102,0.5)' },
    { val: error, color: '#ff6b35', label: 'Error',  glow: 'rgba(255,107,53,0.5)' },
    { val: skip,  color: '#ffcc00', label: 'Skip',   glow: 'rgba(255,204,0,0.4)'  }
  ].filter(s => s.val > 0);

  function polarToXY(angle, radius){
    return {
      x: cx + radius * Math.cos((angle - 90) * Math.PI / 180),
      y: cy + radius * Math.sin((angle - 90) * Math.PI / 180)
    };
  }

  let svgPaths = '';
  let angle = 0;
  const glowDefs = slices.map((s,i) => `
    <filter id="glow${i}" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`).join('');

  slices.forEach((s, i) => {
    const sliceAngle = (s.val / total) * 360;
    const startAngle = angle;
    const endAngle   = angle + sliceAngle;
    const start = polarToXY(startAngle, r);
    const end   = polarToXY(endAngle,   r);
    const large = sliceAngle > 180 ? 1 : 0;

    // label position
    const midAngle = startAngle + sliceAngle / 2;
    const lx = cx + (r * 0.65) * Math.cos((midAngle - 90) * Math.PI / 180);
    const ly = cy + (r * 0.65) * Math.sin((midAngle - 90) * Math.PI / 180);

    const pct = Math.round(s.val / total * 100);

    const path = sliceAngle === 360
      ? `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`
      : `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y} Z`;

    svgPaths += `
      <path class="pie-slice" d="${path}" fill="${s.color}" opacity="0.9"
        data-label="${s.label}" data-idx="${i}" filter="url(#glow${i})"
        style="transform-origin:${cx}px ${cy}px; animation: pieIn 0.8s cubic-bezier(0.34,1.56,0.64,1) ${i*0.1}s both;">
      </path>`;

    if(pct >= 8) {
      svgPaths += `
        <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle"
          font-family="JetBrains Mono,monospace" font-size="11" font-weight="700"
          fill="${s.val===pass ? '#0a0d14' : '#ffffff'}" pointer-events="none">${pct}%</text>`;
    }

    angle += sliceAngle;
  });

  // outer ring
  svgPaths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>`;

  const legendHTML = slices.map(s => `
    <div class="legend-row">
      <div class="legend-swatch" style="background:${s.color};border-radius:50%"></div>
      <div class="legend-name">${s.label}</div>
      <div class="legend-val" style="color:${s.color}">${s.val}</div>
      <div class="legend-pct">${Math.round(s.val/total*100)}%</div>
    </div>`).join('');

  return `
  <div class="pie-layout">
    <div class="pie-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200" id="pie-svg">
        <defs>${glowDefs}</defs>
        ${svgPaths}
      </svg>
    </div>
    <div class="donut-legend">${legendHTML}</div>
  </div>`;
}

/* ── MAIN RENDER ── */
function renderReport(data){
  const suites = (data.tests || []);
  let totalPass=0, totalFail=0, totalSkip=0, totalError=0;

  suites.forEach(s => {
    const st = analyzeTests(s.tests);
    totalPass  += st.pass;
    totalFail  += st.fail;
    totalSkip  += st.skip;
    totalError += st.error;
  });

  const totalEvents = totalPass + totalFail + totalSkip + totalError;
  const passRate = totalEvents ? Math.round((totalPass / totalEvents) * 100) : 0;

  document.getElementById('report-subtitle').textContent = fmtDate(suites[0]?.start);

  let html = `
  <!-- PROGRESS BAR -->
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill"></div>
  </div>

  <!-- STAT CARDS -->
  <div class="summary-grid">
    <div class="stat-card total delay-1"><span class="stat-icon">🔢</span><div class="stat-num" id="cnt-total">0</div><div class="stat-label">Total</div><div class="stat-bar" id="bar-total"></div></div>
    <div class="stat-card pass delay-2"><span class="stat-icon">✅</span><div class="stat-num" id="cnt-pass">0</div><div class="stat-label">Passed</div><div class="stat-bar" id="bar-pass"></div></div>
    <div class="stat-card fail delay-3"><span class="stat-icon">❌</span><div class="stat-num" id="cnt-fail">0</div><div class="stat-label">Failed</div><div class="stat-bar" id="bar-fail"></div></div>
    <div class="stat-card skip delay-4"><span class="stat-icon">⏭</span><div class="stat-num" id="cnt-skip">0</div><div class="stat-label">Skipped</div><div class="stat-bar" id="bar-skip"></div></div>
    <div class="stat-card error delay-5"><span class="stat-icon">⚡</span><div class="stat-num" id="cnt-error">0</div><div class="stat-label">Errors</div><div class="stat-bar" id="bar-error"></div></div>
  </div>

  <!-- CHARTS -->
  <div class="charts-wrapper">
    <div class="chart-card">
      <div class="chart-card-title">◎ Donut Chart — Result Breakdown</div>
      ${buildDonut(totalPass, totalFail, totalSkip, totalError, totalEvents, passRate)}
    </div>
    <div class="chart-card">
      <div class="chart-card-title">◉ Pie Chart — Distribution</div>
      ${buildPie(totalPass, totalFail, totalSkip, totalError, totalEvents)}
    </div>
  </div>

  <div class="section-title">Test Suites</div>
  `;

  suites.forEach((suite, si) => {
    const sid = 'suite-' + si;
    const sStats = analyzeTests(suite.tests);
    const sTotal = sStats.pass + sStats.fail + sStats.skip + sStats.error;
    const sPct   = sTotal ? Math.round(sStats.pass / sTotal * 100) : 0;
    const allPass = !sStats.fail && !sStats.error;
    const statusColor = allPass ? 'var(--pass)' : 'var(--fail)';

    html += `
    <div class="suite-card" style="animation-delay:${si * 0.08}s">
      <div class="suite-header" onclick="toggleCollapse('${sid}')">
        <div class="suite-icon">🗂</div>
        <div class="suite-info">
          <div class="suite-name">${esc(suite.name)}</div>
          <div class="suite-meta">${sTotal} tests · ${sPct}% pass rate</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:${statusColor}">${sPct}%</div>
          <span class="suite-chevron open" id="chev-${sid}">▾</span>
        </div>
      </div>
      <div class="suite-body collapsible open" id="${sid}">`;

    (suite.tests || []).forEach((tc, ti) => {
      const tcid  = 'tc-' + si + '-' + ti;
      const tStats = analyzeTests(tc.tests);
      const status = (tStats.fail || tStats.error) ? 'fail' : (tc.isSkipped ? 'skip' : 'pass');

      html += `
      <div class="testcase">
        <div class="testcase-header" onclick="toggleCollapse('${tcid}')">
          <div class="tc-dot dot-${status}"></div>
          <div class="tc-name">${esc(tc.name)}</div>
          <div class="tc-badge badge-${status}">${status.toUpperCase()}</div>
          <span class="tc-chevron open" id="chev-${tcid}">▾</span>
        </div>
        <div class="testcase-body collapsible open" id="${tcid}">
          <ul class="msg-list">`;

      function collect(arr){
        if(!arr) return;
        arr.forEach(t => {
          if(t.result){
            const cls = t.result.toLowerCase();
            html += `
            <li class="msg-item ${cls}">
              <div class="msg-tag">${t.result}</div>
              <div>${esc(t.text || t.name)}</div>
            </li>`;
          }
          if(t.tests) collect(t.tests);
        });
      }
      collect(tc.tests);

      html += `</ul></div></div>`;
    });

    html += `</div></div>`;
  });

  const reportEl = document.getElementById('report');
  reportEl.innerHTML = html;
  document.getElementById('loading').style.display = 'none';
  reportEl.style.display = 'block';

  /* ── Animate everything after DOM paint ── */
  requestAnimationFrame(() => {
    setTimeout(() => {
      /* counters */
      animateCount(document.getElementById('cnt-total'), totalEvents, 1200);
      animateCount(document.getElementById('cnt-pass'),  totalPass,   1200);
      animateCount(document.getElementById('cnt-fail'),  totalFail,   1200);
      animateCount(document.getElementById('cnt-skip'),  totalSkip,   1200);
      animateCount(document.getElementById('cnt-error'), totalError,  1200);

      /* stat bars */
      if(totalEvents){
        document.getElementById('bar-total').style.width = '100%';
        document.getElementById('bar-pass').style.width  = (totalPass/totalEvents*100) + '%';
        document.getElementById('bar-fail').style.width  = (totalFail/totalEvents*100) + '%';
        document.getElementById('bar-skip').style.width  = (totalSkip/totalEvents*100) + '%';
        document.getElementById('bar-error').style.width = (totalError/totalEvents*100) + '%';
      }

      /* progress bar */
      const pf = document.getElementById('prog-fill');
      if(pf) pf.style.width = passRate + '%';

      /* donut */
      animateDonut(totalPass, totalFail, totalSkip, totalError, totalEvents);

      /* pie tooltips */
      const pieSVG = document.getElementById('pie-svg');
      if(pieSVG){
        pieSVG.querySelectorAll('.pie-slice').forEach(el => {
          const lbl = el.dataset.label;
          el.addEventListener('mouseenter', e => showTT(e, lbl));
          el.addEventListener('mousemove',  moveTT);
          el.addEventListener('mouseleave', hideTT);
        });
      }
    }, 80);
  });
}

/* ── PIE SLICE ANIMATION ── */
const pieStyle = document.createElement('style');
pieStyle.textContent = `
@keyframes pieIn {
  from { opacity: 0; transform: scale(0.5) rotate(-30deg); }
  to   { opacity: 0.9; transform: scale(1) rotate(0deg); }
}`;
document.head.appendChild(pieStyle);

/* ── LOAD ── */
async function loadReport(){
  try {
    const res = await fetch(JSON_FILE);
    if(!res.ok) throw new Error('not found');
    const data = await res.json();
    renderReport(data);
  } catch(err) {
    console.warn('results.json not found, using demo data');
    renderReport(DEMO_DATA);
  }
}

loadReport();
</script>
</body>
</html>
