<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squish Automation Report</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0d14;
  --surface: #111622;
  --surface2: #161d2e;
  --surface3: #1a2340;
  --border: #1e2a3f;
  --border2: rgba(0,229,255,0.18);
  --accent: #00e5ff;
  --accent2: #7c4dff;
  --pass: #00e676;
  --fail: #ff1744;
  --skip: #ffd740;
  --log: #40c4ff;
  --error: #ff5252;
  --text: #e2e8f0;
  --muted: #546e8a;
  --pass-glow: rgba(0,230,118,0.35);
  --fail-glow: rgba(255,23,68,0.35);
  --card-glow: 0 0 0 1px #1e2a3f, 0 8px 32px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridPan 20s linear infinite;
  pointer-events:none;z-index:0;
}
@keyframes gridPan{0%{background-position:0 0}100%{background-position:40px 40px}}

body::after{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% -5%,rgba(0,229,255,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 110%,rgba(124,77,255,0.08) 0%,transparent 55%);
  pointer-events:none;z-index:0;
}

.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:orbFloat linear infinite;opacity:0.35;}
.orb1{width:480px;height:480px;background:radial-gradient(circle,rgba(0,229,255,0.2),transparent 70%);top:-130px;left:-100px;animation-duration:22s;}
.orb2{width:380px;height:380px;background:radial-gradient(circle,rgba(124,77,255,0.18),transparent 70%);bottom:-80px;right:-60px;animation-duration:28s;animation-direction:reverse;}
.orb3{width:260px;height:260px;background:radial-gradient(circle,rgba(0,230,118,0.12),transparent 70%);top:45%;left:55%;animation-duration:19s;}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(28px,-36px) scale(1.04)}66%{transform:translate(-18px,18px) scale(0.96)}}

.container{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:40px 24px 80px;}

/* HEADER */
header{text-align:center;padding:60px 0 48px;animation:fadeDown 0.7s ease both;}
.logo-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);border:1px solid rgba(0,229,255,0.3);padding:6px 16px;border-radius:2px;margin-bottom:24px;animation:pulseGlow 2.5s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(0,229,255,0.2)}50%{box-shadow:0 0 22px rgba(0,229,255,0.55)}}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;letter-spacing:-1px;line-height:1.1;background:linear-gradient(135deg,#e2e8f0 0%,var(--accent) 60%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
.subtitle{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:1px;}

/* STAT CARDS */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;margin-bottom:32px;animation:fadeUp 0.7s 0.2s ease both;}
.stat-card{background:var(--surface);border-radius:10px;padding:22px 16px;text-align:center;box-shadow:var(--card-glow);position:relative;overflow:hidden;transition:transform 0.25s ease,box-shadow 0.25s ease;}
.stat-card:hover{transform:translateY(-5px);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.total::before{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.stat-card.passed::before{background:var(--pass);}
.stat-card.failed::before{background:var(--fail);}
.stat-card.skipped::before{background:var(--skip);}
.stat-card.errors::before{background:var(--error);}
.stat-num{font-size:2.6rem;font-weight:800;line-height:1;margin-bottom:6px;font-family:'Space Mono',monospace;}
.stat-card.total .stat-num{color:var(--accent);}
.stat-card.passed .stat-num{color:var(--pass);text-shadow:0 0 18px var(--pass-glow);}
.stat-card.failed .stat-num{color:var(--fail);text-shadow:0 0 18px var(--fail-glow);}
.stat-card.skipped .stat-num{color:var(--skip);}
.stat-card.errors .stat-num{color:var(--error);}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:600;}
.stat-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 10px 10px;width:0;transition:width 1.6s cubic-bezier(0.16,1,0.3,1);}
.stat-card.total .stat-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.stat-card.passed .stat-bar{background:var(--pass);}
.stat-card.failed .stat-bar{background:var(--fail);}
.stat-card.skipped .stat-bar{background:var(--skip);}
.stat-card.errors .stat-bar{background:var(--error);}

/* PROGRESS */
.progress-section{background:var(--surface);border-radius:10px;padding:24px;margin-bottom:32px;box-shadow:var(--card-glow);animation:fadeUp 0.7s 0.3s ease both;}
.progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.progress-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
.progress-pct{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--pass);}
.progress-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;gap:2px;}
.progress-fill{height:100%;border-radius:4px;transition:width 1.3s cubic-bezier(0.4,0,0.2,1);}
.progress-fill.pass{background:var(--pass);}
.progress-fill.fail{background:var(--fail);}
.progress-fill.skip{background:var(--skip);}

/* META CHIPS */
.meta-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px;animation:fadeUp 0.7s 0.35s ease both;}
.meta-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px 14px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
.meta-chip span{color:var(--text);font-weight:700;}

/* CHARTS */
.charts-wrapper{display:grid;grid-template-columns:1fr;gap:22px;margin-bottom:28px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;position:relative;overflow:hidden;animation:fadeUp 0.7s 0.25s ease both;box-shadow:var(--card-glow);}
.chart-card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:0.5;}
.chart-card-title{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:26px;font-family:'Space Mono',monospace;}

/* DONUT */
.donut-layout{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.donut-wrap{position:relative;width:190px;height:190px;flex-shrink:0;}
.donut-wrap svg{transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(0,229,255,0.12));}
.donut-bg{fill:none;stroke:#1a2340;stroke-width:24;}
.donut-seg{fill:none;stroke-width:24;stroke-linecap:round;transition:stroke-dasharray 1.4s cubic-bezier(0.16,1,0.3,1),stroke-dashoffset 1.4s cubic-bezier(0.16,1,0.3,1);}
.donut-seg:hover{stroke-width:28;opacity:0.85;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-pct{font-family:'Space Mono',monospace;font-size:2.2rem;font-weight:700;color:var(--pass);text-shadow:0 0 20px var(--pass-glow);line-height:1;}
.donut-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:4px;}
.chart-legend{display:flex;flex-direction:column;gap:12px;flex:1;}
.legend-row{display:flex;align-items:center;gap:10px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-name{flex:1;font-size:13px;color:var(--muted);font-weight:600;}
.legend-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.legend-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);width:36px;text-align:right;}


/* LINE GRAPH */
.line-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:32px;box-shadow:var(--card-glow);animation:fadeUp 0.7s 0.3s ease both;}
.line-card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:0.4;}
.line-card{position:relative;overflow:hidden;}
.line-card-title{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:20px;font-family:'Space Mono',monospace;}
.line-chart-wrap{width:100%;overflow-x:auto;}
.line-chart-wrap svg{display:block;}
.lc-axis{font-family:'Space Mono',monospace;font-size:10px;fill:var(--muted);}
.lc-grid{stroke:rgba(30,42,63,0.9);stroke-width:1;}
.lc-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.lc-line-pass{stroke:var(--pass);}
.lc-line-fail{stroke:var(--fail);}
.lc-line-skip{stroke:var(--skip);}
.lc-dot{cursor:pointer;transition:r 0.15s ease;}
.lc-dot:hover{r:7 !important;}
.lc-dot-pass{fill:var(--pass);filter:drop-shadow(0 0 4px var(--pass));}
.lc-dot-fail{fill:var(--fail);filter:drop-shadow(0 0 4px var(--fail));}
.lc-dot-skip{fill:var(--skip);filter:drop-shadow(0 0 4px var(--skip));}
.lc-legend{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;}
.lc-legend-item{display:flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
.lc-legend-line{width:22px;height:3px;border-radius:2px;}

/* SECTION */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* SUITE */
.suite-card{background:var(--surface);border-radius:10px;box-shadow:var(--card-glow);margin-bottom:22px;overflow:hidden;animation:fadeUp 0.6s ease both;}
.suite-header{display:flex;align-items:center;gap:12px;padding:18px 24px;background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background 0.15s;}
.suite-header:hover{background:#1a2336;}
.suite-icon{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.suite-name{font-size:14px;font-weight:700;flex:1;font-family:'Space Mono',monospace;}
.suite-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;}
.chevron{color:var(--muted);font-size:12px;transition:transform 0.3s ease;}
.suite-body{padding:16px 22px;}

/* TESTCASE */
.testcase{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;transition:border-color 0.2s;}
.testcase:hover{border-color:rgba(0,229,255,0.3);}
.testcase-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;background:var(--surface2);transition:background 0.15s;user-select:none;}
.testcase-header:hover{background:#1a2336;}
.tc-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-pass{background:var(--pass);box-shadow:0 0 8px var(--pass-glow);}
.status-fail{background:var(--fail);box-shadow:0 0 8px var(--fail-glow);}
.status-skip{background:var(--skip);}
.status-log{background:var(--log);}
.status-mixed{background:linear-gradient(135deg,var(--fail),var(--skip));box-shadow:0 0 8px var(--fail-glow);}
.tc-name{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;flex:1;}
.tc-duration{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.badge{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:3px;flex-shrink:0;}
.badge-pass{background:rgba(0,230,118,0.15);color:var(--pass);border:1px solid rgba(0,230,118,0.3);}
.badge-fail{background:rgba(255,23,68,0.15);color:var(--fail);border:1px solid rgba(255,23,68,0.3);}
.badge-skip{background:rgba(255,215,64,0.15);color:var(--skip);border:1px solid rgba(255,215,64,0.3);}
.badge-log{background:rgba(64,196,255,0.12);color:var(--log);border:1px solid rgba(64,196,255,0.3);}
.badge-error{background:rgba(255,82,82,0.15);color:var(--error);border:1px solid rgba(255,82,82,0.3);}
.badge-mixed{background:rgba(255,23,68,0.12);color:var(--fail);border:1px solid rgba(255,23,68,0.3);}

/* MESSAGES */
.testcase-body{padding:0;}
.msg-list{list-style:none;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.msg-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,0.02);border-left:3px solid var(--border);font-size:12px;font-family:'Space Mono',monospace;animation:slideIn 0.3s ease both;transition:transform 0.2s ease;}
.msg-item:hover{transform:translateX(3px);}
.msg-item.pass{border-left-color:var(--pass);}
.msg-item.fail{border-left-color:var(--fail);}
.msg-item.error{border-left-color:var(--error);}
.msg-item.skip{border-left-color:var(--skip);}
.msg-item.log{border-left-color:var(--log);}
.msg-item.screenshot{border-left-color:var(--accent2);}
.msg-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.msg-content{flex:1;min-width:0;}
.msg-text{color:var(--text);word-break:break-all;}
.msg-detail{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.5;}
.msg-time{color:var(--muted);font-size:9px;flex-shrink:0;}
.vp-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.vp-tag{font-size:10px;font-family:'Space Mono',monospace;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:3px;padding:2px 8px;color:var(--muted);}
.vp-tag strong{color:var(--text);}

/* INLINE IMAGES */
.msg-item.has-image{padding-bottom:12px;}
.msg-text-row{margin-bottom:10px;line-height:1.6;word-break:break-all;}
.inline-img-wrap{margin-top:8px;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--bg);}
.inline-img-path{padding:7px 12px;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);word-break:break-all;}
.inline-img{display:block;max-width:100%;max-height:400px;width:auto;height:auto;object-fit:contain;cursor:zoom-in;transition:transform 0.2s,filter 0.2s;padding:8px;background:#090b10;}
.inline-img:hover{transform:scale(1.01);filter:brightness(1.07);}
.img-broken-msg{padding:16px;display:flex;align-items:center;gap:12px;font-family:'Space Mono',monospace;font-size:11px;color:var(--error);}
.img-open-link{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(0,229,255,0.3);padding-bottom:1px;}
.img-open-link:hover{color:var(--pass);}

/* FEATURE / SCENARIO / STEP */
.feature-block{border:1px solid rgba(124,77,255,0.3);border-radius:8px;margin:12px 16px;overflow:hidden;}
.feature-header{padding:10px 14px;background:rgba(124,77,255,0.1);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);display:flex;align-items:center;gap:8px;}
.scenario-block{border-top:1px solid rgba(124,77,255,0.2);padding:12px 14px;}
.scenario-name{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:8px;}
.step-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);transition:background 0.15s;}
.step-item:hover{background:rgba(255,255,255,0.03);}
.step-item.step-pass{color:var(--pass);}
.step-item.step-fail{color:var(--fail);}
.step-item.step-skip{color:var(--skip);opacity:0.6;}
.step-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.step-error-msg{font-size:10px;color:var(--error);margin-top:3px;padding-left:22px;}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;z-index:10000;background:rgba(5,7,15,0.93);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;cursor:zoom-out;}
#lightbox.open{display:flex;animation:lbIn 0.2s ease;}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox-img{max-width:90vw;max-height:80vh;border-radius:10px;border:1px solid var(--border2);box-shadow:0 30px 100px rgba(0,0,0,0.7);object-fit:contain;animation:lbImgIn 0.25s cubic-bezier(0.34,1.56,0.64,1);cursor:default;}
@keyframes lbImgIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}
#lightbox-caption{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);max-width:80vw;text-align:center;word-break:break-all;}
#lightbox-close{position:fixed;top:20px;right:26px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s,color 0.2s;}
#lightbox-close:hover{background:var(--fail);color:#fff;border-color:var(--fail);}

/* TOOLTIP */
#tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border2);padding:7px 13px;border-radius:7px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text);pointer-events:none;z-index:9999;opacity:0;transition:opacity 0.15s;white-space:nowrap;}
#tooltip.visible{opacity:1;}

/* COLLAPSE */
.collapsible{display:none;}
.collapsible.open{display:block;}

/* LOADING / ERROR */
#loading{text-align:center;padding:120px 40px;}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:2px;}
#error-msg{display:none;text-align:center;padding:80px 40px;}
.error-box{display:inline-block;background:rgba(255,23,68,0.08);border:1px solid rgba(255,23,68,0.3);border-radius:8px;padding:24px 32px;font-family:'Space Mono',monospace;font-size:13px;color:var(--fail);}
#report{display:none;}

/* ANIMATIONS */
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}


::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

@media(max-width:900px){.charts-wrapper{grid-template-columns:1fr;}}
@media(max-width:600px){.summary-grid{grid-template-columns:repeat(2,1fr);}.meta-bar{flex-direction:column;}.donut-layout{flex-direction:column;}}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div id="tooltip"></div>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()"/>
  <div id="lightbox-caption"></div>
</div>

<div class="container">
  <header>
    <div class="logo-tag"><span class="logo-dot"></span> SQUISH AUTOMATION REPORT</div>
    <h1>Test Execution Results</h1>
    <p class="subtitle" id="report-subtitle">Loading report data…</p>
  </header>
  <div id="loading"><div class="spinner"></div><div class="loading-text">FETCHING RESULTS…</div></div>
  <div id="error-msg"><div class="error-box">⚠ Failed to load <code>results.json</code><br><br>Make sure <strong>results.json</strong> is in the same folder as <strong>index.html</strong>.</div></div>
  <div id="report"></div>
</div>

<script>
const JSON_FILE = 'results.json';

/* ══ DEMO DATA (fallback) ══ */
const DEMO = {
  version:{ major:6, minor:7 },
  tests:[{
    type:'testsuite', name:'suite_Demo',
    start: new Date(Date.now()-3600000).toISOString(),
    stop:  new Date(Date.now()-2000000).toISOString(),
    tests:[
      { type:'testcase', name:'tst_Demo_Login',
        start: new Date(Date.now()-3590000).toISOString(), stop: new Date(Date.now()-3400000).toISOString(),
        tests:[
          { type:'msg', result:'PASS', text:'Navigated to login page', time: new Date(Date.now()-3580000).toISOString() },
          { type:'msg', result:'PASS', text:'Credentials entered', time: new Date(Date.now()-3560000).toISOString() },
          { type:'scriptedVerificationResult', result:'PASS', text:'Login successful (Screenshot in "c:\\report\\passed_1.png")', screenshotUrl:'x-results:suite_Demo/tst_Demo/passedImages/passed_1.png', time: new Date(Date.now()-3530000).toISOString() }
        ]
      }
    ]
  }]
};

/* ══ UTILS ══ */
function fmtTime(iso){ if(!iso) return '—'; return new Date(iso).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'2-digit'}); }
function duration(a,b){ if(!a||!b) return ''; const ms=new Date(b)-new Date(a); return ms<1000?ms+'ms':(ms/1000).toFixed(2)+'s'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ══ LEAF NODE DETECTION ══
 * Squish BDD JSON uses many container types. A "leaf" is any node that
 * carries an actual test result: msg, scriptedVerificationResult, propertyVerificationResult.
 */
const LEAF_TYPES = new Set(['msg','scriptedVerificationResult','propertyVerificationResult','screenshot']);

/* Collect all leaf result nodes from any depth of nesting */
function collectLeaves(nodes){
  const leaves=[];
  function walk(arr){
    if(!Array.isArray(arr)) return;
    for(const n of arr){
      if(LEAF_TYPES.has(n.type)) leaves.push(n);
      if(n.tests) walk(n.tests);
    }
  }
  walk(nodes);
  return leaves;
}

/* ══ ANALYSIS — works on deeply nested Squish BDD structures ══ */
function analyzeTests(tests){
  const s={pass:0,fail:0,skip:0,error:0,log:0,total:0};
  const leaves=collectLeaves(tests);
  for(const t of leaves){
    const r=(t.result||'').toUpperCase();
    if(r==='PASS'){ s.pass++; s.total++; }
    else if(r==='FAIL'){ s.fail++; s.total++; }
    else if(r==='ERROR'){ s.error++; s.total++; }
    else if(r==='LOG'){ s.log++; s.total++; }
    else { s.log++; s.total++; }
  }
  // Also count explicitly skipped testcases
  function countSkipped(arr){
    if(!Array.isArray(arr)) return;
    for(const n of arr){
      if(n.isSkipped){ s.skip++; s.total++; }
      if(n.tests) countSkipped(n.tests);
    }
  }
  countSkipped(tests);
  return s;
}

function tcStatus(tests){
  const s=analyzeTests(tests);
  if(s.error>0) return 'fail';
  if(s.fail>0) return 'fail';
  if(s.skip>0&&s.pass===0&&s.fail===0) return 'skip';
  if(s.pass>0) return 'pass';
  if(s.log>0) return 'log';
  return 'skip';
}

/* ══ TOOLTIP ══ */
const ttEl=document.getElementById('tooltip');
function showTT(e,txt){ttEl.textContent=txt;ttEl.classList.add('visible');moveTT(e);}
function moveTT(e){ttEl.style.left=(e.clientX+14)+'px';ttEl.style.top=(e.clientY-12)+'px';}
function hideTT(){ttEl.classList.remove('visible');}

/* ══ LIGHTBOX ══ */
function openLightbox(src,caption){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox-caption').textContent=caption;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src='';
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });

/* ══ TOGGLE ══ */
function toggleCollapse(id){
  const el=document.getElementById(id);
  const ch=document.getElementById('chev-'+id);
  if(!el) return;
  el.classList.toggle('open');
  if(ch) ch.style.transform=el.classList.contains('open')?'':'rotate(-90deg)';
}

/* ══ COUNTER ══ */
function animateCount(el,target,delay){
  if(!el) return;
  setTimeout(()=>{
    let v=0;const step=Math.ceil(target/30);
    const t=setInterval(()=>{ v=Math.min(v+step,target); el.textContent=v; if(v>=target) clearInterval(t); },30);
  },delay);
}

/* ══ BADGE ══ */
function badge(status){
  const labels={pass:'PASS',fail:'FAIL',skip:'SKIP',log:'LOG',error:'ERROR',mixed:'MIXED'};
  return `<span class="badge badge-${status}">${labels[status]||status.toUpperCase()}</span>`;
}

/* ══ IMAGE PATH / SCREENSHOT DETECTION ══
 * Squish puts paths in two places:
 *   1) node.screenshotUrl  e.g. "x-results:suite_CMSearch/tst_CMSearch/passedImages/passed_1.png"
 *   2) inline in node.text  e.g. '(Screenshot in "c:\report\...\passed_1.png")'
 */
const IMG_RE=/([a-zA-Z]:[\\\/][^\s,;|"'<>]+\.(?:png|jpg|jpeg|gif|bmp|webp)|(?:\.{0,2}[\\\/])[^\s,;|"'<>]+\.(?:png|jpg|jpeg|gif|bmp|webp))/gi;

function resolveScreenshotSrc(node){
  // Prefer screenshotUrl if present (x-results: scheme → relative path)
  if(node.screenshotUrl){
    const url=node.screenshotUrl;
    if(url.startsWith('x-results:')){
      // x-results:suite_CMSearch/tst_CMSearch/passedImages/passed_1.png
      // Resolve relative to results.json location (same folder as index.html)
      return url.replace(/^x-results:/,'');
    }
    return url;
  }
  return null;
}

function buildImgHtml(raw, node){
  const imgs=[];

  // 1. screenshotUrl from the node itself
  const ss=resolveScreenshotSrc(node||{});
  if(ss) imgs.push({src:ss, label:ss});

  // 2. Windows/relative paths embedded in text
  const found=[...raw.matchAll(IMG_RE)].map(m=>m[1]);
  for(const p of found){
    const norm=p.replace(/\\/g,'/');
    const src=/^[a-zA-Z]:\//.test(norm)?'file:///'+norm:norm;
    imgs.push({src,label:p});
  }

  if(!imgs.length) return '';
  return imgs.map(({src,label})=>`<div class="inline-img-wrap">
    <div class="inline-img-path">📁 ${esc(label)}</div>
    <img class="inline-img" src="${src}" alt="${esc(label)}" loading="lazy"
      onclick="openLightbox(this.src,'${esc(label).replace(/'/g,'&#39;')}')"
      onerror="this.closest('.inline-img-wrap').classList.add('img-broken');this.style.display='none';this.nextElementSibling.style.display='flex';"/>
    <div class="img-broken-msg" style="display:none">
      <span>⚠ Image not found</span>
      <a href="${src}" target="_blank" class="img-open-link">Open path ↗</a>
    </div>
  </div>`).join('');
}

/* ══ RENDER A SINGLE LEAF MESSAGE ══ */
function renderLeaf(t){
  // Determine display class from result
  const r=(t.result||'').toUpperCase();
  let cls='log', icon='›';
  if(r==='PASS'){cls='pass';icon='✓';}
  else if(r==='FAIL'){cls='fail';icon='✗';}
  else if(r==='ERROR'){cls='error';icon='✗';}
  else if(r==='LOG'){cls='log';icon='›';}

  const raw=t.text||'';
  const imgHtml=buildImgHtml(raw,t);

  if(t.type==='propertyVerificationResult'){
    return `<li class="msg-item ${cls}">
      <span class="msg-icon">${icon}</span>
      <div class="msg-content">
        <div class="msg-text">${esc(raw)}</div>
        <div class="vp-row">
          <span class="vp-tag">Object: <strong>${esc(t.objectName||'')}</strong></span>
          <span class="vp-tag">Expected: <strong>${esc(t.expectedValue||'')}</strong></span>
          <span class="vp-tag">Actual: <strong>${esc(t.actualValue||'')}</strong></span>
        </div>
      </div>
      <span class="msg-time">${fmtTime(t.time)}</span>
    </li>`;
  }

  return `<li class="msg-item ${cls}${imgHtml?' has-image':''}">
    <span class="msg-icon">${icon}</span>
    <div class="msg-content">
      ${imgHtml?`<div class="msg-text-row">${esc(raw)}</div>`:`<div class="msg-text">${esc(raw)}</div>`}
      ${t.detail?`<div class="msg-detail">${esc(t.detail)}</div>`:''}
      ${imgHtml}
    </div>
    <span class="msg-time">${fmtTime(t.time)}</span>
  </li>`;
}

/* ══ RENDER STEP (type:'step') — renders its name + its leaf children ══ */
function renderStep(step){
  const leaves=collectLeaves(step.tests||[]);
  const hasErr=leaves.some(m=>m.result==='ERROR'||m.result==='FAIL');
  const hasPass=leaves.some(m=>m.result==='PASS');
  let cls='',dot='var(--muted)',icon='·';
  if(step.isSkipped){cls='step-skip';dot='var(--skip)';icon='○';}
  else if(hasErr){cls='step-fail';dot='var(--fail)';icon='✗';}
  else if(hasPass){cls='step-pass';dot='var(--pass)';icon='✓';}
  else if(leaves.length){icon='›';}

  const errMsgs=leaves.filter(m=>m.result==='ERROR'||m.result==='FAIL')
    .map(m=>`<div class="step-error-msg">⚠ ${esc(m.text||'')}${m.detail?' — '+esc(m.detail):''}</div>`).join('');

  // Render inline screenshot images for this step's pass results
  const imgItems=leaves.filter(m=>(m.result==='PASS'||m.result==='LOG')&&(m.screenshotUrl||IMG_RE.test(m.text||'')));
  const imgs=imgItems.map(m=>{
    IMG_RE.lastIndex=0;
    return buildImgHtml(m.text||'',m);
  }).filter(Boolean).join('');

  return `<div class="step-item ${cls}">
    <span class="step-dot" style="background:${dot}"></span>
    <span>${icon} ${esc(step.name||'')}</span>
  </div>${errMsgs}${imgs?`<div style="padding:4px 22px">${imgs}</div>`:''}`;
}

/* ══ RENDER SCENARIO / ROW ══ */
function renderScenario(sc){
  // A scenario or row may contain step nodes or leaf nodes directly
  const steps=(sc.tests||[]).filter(t=>t.type==='step');
  const directLeaves=(sc.tests||[]).filter(t=>LEAF_TYPES.has(t.type));
  const hasErr=collectLeaves(sc.tests||[]).some(m=>m.result==='ERROR'||m.result==='FAIL');
  const dotColor=hasErr?'var(--fail)':'var(--pass)';
  const label=sc.name||sc.type||'Scenario';
  const stepHtml=steps.map(renderStep).join('');
  const leafHtml=directLeaves.length?`<ul class="msg-list">${directLeaves.map(renderLeaf).join('')}</ul>`:'';
  return `<div class="scenario-block">
    <div class="scenario-name">
      <span style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;display:inline-block"></span>
      ${esc(label)}
    </div>
    ${stepHtml}${leafHtml}
  </div>`;
}

/* ══ RENDER SCENARIOOUTLINE (contains rows) ══ */
function renderScenarioOutline(outline){
  // Each row is like a scenario
  const rows=(outline.tests||[]).filter(t=>t.type==='row');
  if(rows.length) return rows.map(renderScenario).join('');
  // Fallback: treat as plain scenario
  return renderScenario(outline);
}

/* ══ RENDER FEATURE ══ */
function renderFeature(feat){
  let inner='';
  for(const child of (feat.tests||[])){
    if(child.type==='scenariooutline') inner+=renderScenarioOutline(child);
    else if(child.type==='scenario') inner+=renderScenario(child);
    else if(child.type==='row') inner+=renderScenario(child);
    else if(child.type==='step') inner+=renderStep(child);
    else if(LEAF_TYPES.has(child.type)){
      inner+=`<ul class="msg-list">${renderLeaf(child)}</ul>`;
    }
  }
  return `<div class="feature-block">
    <div class="feature-header">◈ Feature — ${esc(feat.name||'')}</div>
    ${inner}
  </div>`;
}

/* ══ RENDER TESTCASE ══ */
let tcCounter=0;
function renderTestCase(tc){
  tcCounter++;
  const id='tc-'+tcCounter;
  const status=tcStatus(tc.tests||[]);
  const dur=duration(tc.start,tc.stop);
  const st=analyzeTests(tc.tests||[]);
  const bStatus=st.error>0?'error':(st.fail>0?'fail':status);

  // Build body: features first, then top-level leaf messages
  let body='';
  for(const child of (tc.tests||[])){
    if(child.type==='feature') body+=renderFeature(child);
    else if(child.type==='scenariooutline') body+=renderScenarioOutline(child);
    else if(child.type==='scenario') body+=renderScenario(child);
    else if(child.type==='step') body+=renderStep(child);
    else if(LEAF_TYPES.has(child.type)){
      body+=`<ul class="msg-list">${renderLeaf(child)}</ul>`;
    }
  }

  return `<div class="testcase">
    <div class="testcase-header" onclick="toggleCollapse('${id}')">
      <span class="tc-status status-${status}"></span>
      <span class="tc-name">${esc(tc.name||'')}</span>
      ${dur?`<span class="tc-duration">${dur}</span>`:''}
      ${badge(bStatus)}
      <span class="chevron" id="chev-${id}">▼</span>
    </div>
    <div class="testcase-body collapsible open" id="${id}">
      ${body||'<div style="padding:12px 16px;font-size:11px;color:var(--muted);font-family:Space Mono,monospace;">No detailed logs.</div>'}
    </div>
  </div>`;
}

/* ══ RENDER SUITE ══ */
let suiteCounter=0;
function renderSuite(suite){
  suiteCounter++;
  const id='suite-'+suiteCounter;
  const dur=duration(suite.start,suite.stop);
  const tcs=(suite.tests||[]).filter(t=>t.type==='testcase');
  const st=analyzeTests(suite.tests||[]);
  return `<div class="suite-card" style="animation-delay:${(suiteCounter-1)*0.1}s">
    <div class="suite-header" onclick="toggleCollapse('${id}')">
      <div class="suite-icon">⚙</div>
      <div>
        <div class="suite-name">${esc(suite.name||'')}</div>
        <div class="suite-meta">${tcs.length} test case${tcs.length!==1?'s':''} · ${dur||'—'}</div>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        ${st.pass?`<span class="badge badge-pass">${st.pass} PASS</span>`:''}
        ${st.fail?`<span class="badge badge-fail">${st.fail} FAIL</span>`:''}
        ${st.error?`<span class="badge badge-error">${st.error} ERR</span>`:''}
        ${st.skip?`<span class="badge badge-skip">${st.skip} SKIP</span>`:''}
        ${st.log?`<span class="badge badge-log">${st.log} LOG</span>`:''}
      </div>
      <span class="chevron" id="chev-${id}">▼</span>
    </div>
    <div class="suite-body collapsible open" id="${id}">
      ${tcs.map(renderTestCase).join('')||'<div style="color:var(--muted);font-size:12px;font-family:Space Mono,monospace;">No test cases found.</div>'}
    </div>
  </div>`;
}

/* ══ DONUT CHART ══ */
function buildDonut(pass,fail,skip,error,total,passRate){
  if(!total) return '<div style="color:var(--muted);font-size:12px;text-align:center;padding:40px">No data</div>';
  const r=78,cx=95,cy=95,circ=2*Math.PI*r;
  const segs=[
    {val:pass,color:'#00e676',label:'Passed',id:'ds-pass'},
    {val:fail,color:'#ff1744',label:'Failed',id:'ds-fail'},
    {val:error,color:'#ff5252',label:'Errors',id:'ds-error'},
    {val:skip,color:'#ffd740',label:'Skipped',id:'ds-skip'}
  ].filter(s=>s.val>0);
  const circles=segs.map(s=>`<circle id="${s.id}" class="donut-seg" cx="${cx}" cy="${cy}" r="${r}" stroke="${s.color}" stroke-dasharray="0 ${circ}" stroke-dashoffset="0"/>`).join('');
  const legend=segs.map(s=>`<div class="legend-row">
    <div class="legend-swatch" style="background:${s.color}"></div>
    <div class="legend-name">${s.label}</div>
    <div class="legend-val" style="color:${s.color}">${s.val}</div>
    <div class="legend-pct">${Math.round(s.val/total*100)}%</div>
  </div>`).join('');
  return `<div class="donut-layout">
    <div class="donut-wrap">
      <svg width="190" height="190" viewBox="0 0 190 190">
        <circle class="donut-bg" cx="${cx}" cy="${cy}" r="${r}"/>
        ${circles}
      </svg>
      <div class="donut-center">
        <div class="donut-pct">${passRate}%</div>
        <div class="donut-lbl">PASS RATE</div>
      </div>
    </div>
    <div class="chart-legend">${legend}</div>
  </div>`;
}

function animateDonut(pass,fail,skip,error,total){
  if(!total) return;
  const r=78,circ=2*Math.PI*r;
  const segs=[
    {val:pass,id:'ds-pass',label:'Passed'},
    {val:fail,id:'ds-fail',label:'Failed'},
    {val:error,id:'ds-error',label:'Errors'},
    {val:skip,id:'ds-skip',label:'Skipped'}
  ].filter(s=>s.val>0);
  let offset=0;
  segs.forEach(seg=>{
    const el=document.getElementById(seg.id);
    if(!el) return;
    const dash=(seg.val/total)*circ;
    el.style.strokeDasharray=`${dash} ${circ-dash}`;
    el.style.strokeDashoffset=-offset;
    offset+=dash;
    el.addEventListener('mouseenter',e=>showTT(e,`${seg.label}: ${seg.val} (${Math.round(seg.val/total*100)}%)`));
    el.addEventListener('mousemove',moveTT);
    el.addEventListener('mouseleave',hideTT);
  });
}

/* ══ LINE GRAPH ══ */
function buildLineGraph(suites){
  if(!suites||suites.length<2) return '';
  const W=740,H=210,PL=46,PR=22,PT=20,PB=42;
  const iW=W-PL-PR,iH=H-PT-PB;
  const points=suites.map(s=>{
    const st=analyzeTests(s.tests||[]);
    return {name:s.name||'Suite',pass:st.pass,fail:st.fail+st.error,skip:st.skip,total:st.pass+st.fail+st.error+st.skip};
  });
  const maxVal=Math.max(...points.map(p=>Math.max(p.pass,p.fail,p.skip)),1);
  const n=points.length;
  const xStep=iW/(n>1?n-1:1);
  function py(v){return PT+iH-(v/maxVal)*iH;}
  function px(i){return PL+i*xStep;}

  const gridLines=[0,0.25,0.5,0.75,1].map(f=>{
    const y=py(f*maxVal);
    const label=Math.round(f*maxVal);
    return `<line class="lc-grid" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>
            <text class="lc-axis" x="${PL-6}" y="${y+4}" text-anchor="end">${label}</text>`;
  }).join('');

  const xLabels=points.map((p,i)=>{
    const short=p.name.length>14?'…'+p.name.slice(-13):p.name;
    return `<text class="lc-axis" x="${px(i)}" y="${H-PB+16}" text-anchor="middle">${esc(short)}</text>`;
  }).join('');

  function makeLine(key,cls){
    if(n===1){
      return `<circle class="lc-dot lc-dot-${cls}" cx="${px(0)}" cy="${py(points[0][key])}" r="5"/>`;
    }
    const ptStr=points.map((p,i)=>`${px(i)},${py(p[key])}`).join(' ');
    const areaStr=`${px(0)},${py(0)} `+points.map((p,i)=>`${px(i)},${py(p[key])}`).join(' ')+` ${px(n-1)},${py(0)}`;
    const fillCol=cls==='pass'?'rgba(0,230,118,0.07)':cls==='fail'?'rgba(255,23,68,0.07)':'rgba(255,215,64,0.05)';
    const dots=points.map((p,i)=>`<circle class="lc-dot lc-dot-${cls}" cx="${px(i)}" cy="${py(p[key])}" r="4"
        onmouseenter="showTT(event,'${esc(p.name)}: ${p[key]} ${key}')" onmousemove="moveTT(event)" onmouseleave="hideTT()"/>`).join('');
    return `<polygon points="${areaStr}" fill="${fillCol}" stroke="none"/>
            <polyline class="lc-line lc-line-${cls}" points="${ptStr}" stroke-dasharray="9999" stroke-dashoffset="9999" id="ll-${cls}"/>
            ${dots}`;
  }

  const allLines=makeLine('pass','pass')+makeLine('fail','fail')+makeLine('skip','skip');
  return `<div class="line-card">
    <div class="line-card-title">◎ Suite-by-Suite Line Graph</div>
    <div class="line-chart-wrap">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;">
        ${gridLines}${xLabels}${allLines}
      </svg>
    </div>
    <div class="lc-legend">
      <div class="lc-legend-item"><div class="lc-legend-line" style="background:var(--pass)"></div>Pass</div>
      <div class="lc-legend-item"><div class="lc-legend-line" style="background:var(--fail)"></div>Fail / Error</div>
      <div class="lc-legend-item"><div class="lc-legend-line" style="background:var(--skip)"></div>Skipped</div>
    </div>
  </div>`;
}

function animateLineGraph(){
  ['pass','fail','skip'].forEach((cls,i)=>{
    const el=document.getElementById('ll-'+cls);
    if(!el) return;
    setTimeout(()=>{
      try{
        const len=el.getTotalLength();
        el.style.strokeDasharray=len;
        el.style.strokeDashoffset=len;
        el.style.transition=`stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1) ${i*0.18}s`;
        requestAnimationFrame(()=>{ el.style.strokeDashoffset='0'; });
      }catch(e){ el.style.strokeDasharray='none'; }
    },300);
  });
}

/* ══ MAIN RENDER ══ */
function renderReport(data){
  const suites=(data.tests||[]).filter(t=>t.type==='testsuite');
  const allTCs=[];
  suites.forEach(s=>(s.tests||[]).forEach(t=>t.type==='testcase'&&allTCs.push(t)));

  // Aggregate counts across all leaves in all suites
  let totalPass=0,totalFail=0,totalSkip=0,totalError=0,totalLog=0;
  suites.forEach(s=>{
    const st=analyzeTests(s.tests||[]);
    totalPass+=st.pass; totalFail+=st.fail; totalSkip+=st.skip; totalError+=st.error; totalLog+=st.log;
  });
  const totalEvents=totalPass+totalFail+totalSkip+totalError+totalLog;
  const passRate=totalEvents?Math.round(totalPass/totalEvents*100):0;

  const startDate=fmtDate(data.tests?.[0]?.start);
  const startTime=fmtTime(data.tests?.[0]?.start);
  const ver=data.version?`v${data.version.major}.${data.version.minor}`:'—';
  document.getElementById('report-subtitle').textContent=`${startDate} · ${startTime} · Squish ${ver}`;

  let html=`
  <div class="summary-grid">
    <div class="stat-card total"><div class="stat-num" id="cnt-total">0</div><div class="stat-label">Total Events</div><div class="stat-bar" id="bar-total"></div></div>
    <div class="stat-card passed"><div class="stat-num" id="cnt-pass">0</div><div class="stat-label">Passed</div><div class="stat-bar" id="bar-pass"></div></div>
    <div class="stat-card failed"><div class="stat-num" id="cnt-fail">0</div><div class="stat-label">Failed</div><div class="stat-bar" id="bar-fail"></div></div>
    <div class="stat-card skipped"><div class="stat-num" id="cnt-skip">0</div><div class="stat-label">Skipped / Log</div><div class="stat-bar" id="bar-skip"></div></div>
    <div class="stat-card errors"><div class="stat-num" id="cnt-error">0</div><div class="stat-label">Errors</div><div class="stat-bar" id="bar-error"></div></div>
  </div>

  <div class="progress-section">
    <div class="progress-label">
      <span class="progress-title">Pass Rate</span>
      <span class="progress-pct">${passRate}%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill pass" id="prog-pass" style="width:0%"></div>
      <div class="progress-fill fail" id="prog-fail" style="width:0%"></div>
      <div class="progress-fill skip" id="prog-skip" style="width:0%"></div>
    </div>
  </div>

  <div class="meta-bar">
    <div class="meta-chip">DATE <span>${startDate}</span></div>
    <div class="meta-chip">TIME <span>${startTime}</span></div>
    <div class="meta-chip">SUITES <span>${suites.length}</span></div>
    <div class="meta-chip">TEST CASES <span>${allTCs.length}</span></div>
    <div class="meta-chip">VERSION <span>${ver}</span></div>
  </div>

  <div class="charts-wrapper">
    <div class="chart-card">
      <div class="chart-card-title">◎ Donut — Result Breakdown</div>
      ${buildDonut(totalPass,totalFail,totalSkip+totalLog,totalError,totalEvents,passRate)}
    </div>
    <div class="chart-card">
      <div class="chart-card-title">◉ Pie — Distribution</div>
      ${buildPie(totalPass,totalFail,totalSkip+totalLog,totalError,totalEvents)}
    </div>
  </div>

  ${buildLineGraph(suites)}

  <div class="section-title">Test Suites</div>
  ${suites.map(renderSuite).join('')}
  `;

  const rep=document.getElementById('report');
  rep.innerHTML=html;
  document.getElementById('loading').style.display='none';
  rep.style.display='block';

  requestAnimationFrame(()=>setTimeout(()=>{
    animateCount(document.getElementById('cnt-total'),totalEvents,100);
    animateCount(document.getElementById('cnt-pass'),totalPass,200);
    animateCount(document.getElementById('cnt-fail'),totalFail,300);
    animateCount(document.getElementById('cnt-skip'),totalSkip+totalLog,400);
    animateCount(document.getElementById('cnt-error'),totalError,500);

    if(totalEvents){
      const vals={pass:totalPass,fail:totalFail,skip:totalSkip+totalLog,error:totalError,total:totalEvents};
      ['pass','fail','skip','error','total'].forEach(k=>{
        const b=document.getElementById('bar-'+k);
        if(b) b.style.width=(vals[k]/totalEvents*100)+'%';
      });
      setTimeout(()=>{
        document.getElementById('prog-pass').style.width=(totalPass/totalEvents*100)+'%';
        document.getElementById('prog-fail').style.width=(totalFail/totalEvents*100)+'%';
        document.getElementById('prog-skip').style.width=((totalSkip+totalLog)/totalEvents*100)+'%';
      },200);
    }

    animateDonut(totalPass,totalFail,totalSkip+totalLog,totalError,totalEvents);
    animateLineGraph();

    const pieSVG=document.getElementById('pie-svg');
    if(pieSVG) pieSVG.querySelectorAll('.pie-slice').forEach(el=>{
      el.addEventListener('mouseenter',e=>showTT(e,el.dataset.label));
      el.addEventListener('mousemove',moveTT);
      el.addEventListener('mouseleave',hideTT);
    });
  },80));
}

/* ══ LOAD ══ */
async function loadReport(){
  try{
    const res=await fetch(JSON_FILE);
    if(!res.ok) throw new Error('not found');
    renderReport(await res.json());
  }catch(e){
    console.warn('results.json not found — showing demo data');
    renderReport(DEMO);
  }
}
loadReport();
</script>
