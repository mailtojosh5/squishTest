<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squish Test Report</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0d14;
  --surface:#111622;
  --surface2:#161d2e;
  --border:#1e2a3f;
  --accent:#00e5ff;
  --accent2:#7c4dff;
  --pass:#00e676;
  --fail:#ff1744;
  --skip:#ffd740;
  --error:#ff5252;
  --log:#40c4ff;
  --text:#e2e8f0;
  --muted:#7c8aa5;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh;
}

.container{
  width:min(1400px,95%);
  margin:auto;
  padding:40px 0 80px;
}

header{
  text-align:center;
  margin-bottom:40px;
}

h1{
  font-size:3rem;
  margin-bottom:10px;
  background:linear-gradient(135deg,#fff,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  color:var(--muted);
  font-family:'Space Mono',monospace;
  font-size:12px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:30px;
}

.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:24px;
  text-align:center;
}

.stat-num{
  font-size:2.8rem;
  font-weight:800;
  font-family:'Space Mono',monospace;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
  text-transform:uppercase;
  letter-spacing:2px;
}

.total .stat-num{color:var(--accent);}
.passed .stat-num{color:var(--pass);}
.failed .stat-num{color:var(--fail);}
.skipped .stat-num{color:var(--skip);}
.errors .stat-num{color:var(--error);}

.progress-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:24px;
  margin-bottom:30px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.progress-title{
  font-size:12px;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}

.progress-pct{
  color:var(--pass);
  font-family:'Space Mono',monospace;
  font-size:22px;
}

.progress-bar{
  display:flex;
  overflow:hidden;
  height:10px;
  border-radius:8px;
  background:var(--border);
}

.progress-fill{
  height:100%;
}

.pass{background:var(--pass);}
.fail{background:var(--fail);}
.skip{background:var(--skip);}
.error{background:var(--error);}

.section-title{
  margin:40px 0 20px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
}

.suite-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:24px;
}

.suite-header{
  padding:18px 24px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.suite-name{
  font-size:15px;
  font-weight:700;
  font-family:'Space Mono',monospace;
}

.suite-meta{
  font-size:11px;
  color:var(--muted);
  font-family:'Space Mono',monospace;
}

.suite-body{
  padding:24px;
}

.testcase{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:16px;
}

.testcase-header{
  background:var(--surface2);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.tc-status{
  width:10px;
  height:10px;
  border-radius:50%;
}

.status-pass{
  background:var(--pass);
}

.status-fail{
  background:var(--fail);
}

.status-skip{
  background:var(--skip);
}

.tc-name{
  flex:1;
  font-family:'Space Mono',monospace;
  font-size:12px;
  font-weight:700;
}

.tc-duration{
  color:var(--muted);
  font-size:11px;
  font-family:'Space Mono',monospace;
}

.testcase-body{
  padding:16px;
}

.feature-block{
  border:1px solid rgba(124,77,255,0.4);
  border-radius:10px;
  margin-bottom:20px;
  overflow:hidden;
}

.feature-header{
  background:rgba(124,77,255,0.15);
  color:var(--accent2);
  padding:12px 16px;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}

.scenario-block{
  padding:16px;
  border-top:1px solid rgba(124,77,255,0.2);
}

.scenario-name{
  font-size:14px;
  margin-bottom:14px;
  font-weight:700;
}

.step-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  margin-bottom:8px;
  border-radius:6px;
  background:rgba(255,255,255,0.02);
  font-family:'Space Mono',monospace;
  font-size:12px;
}

.step-pass{
  color:var(--pass);
}

.step-fail{
  color:var(--fail);
}

.step-skip{
  color:var(--skip);
}

.step-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.msg-list{
  list-style:none;
  margin-top:8px;
}

.msg-item{
  background:rgba(255,255,255,0.03);
  border-left:3px solid var(--border);
  padding:10px 12px;
  border-radius:6px;
  margin-bottom:8px;
  display:flex;
  gap:10px;
  font-family:'Space Mono',monospace;
  font-size:12px;
}

.msg-item.pass{
  border-left-color:var(--pass);
}

.msg-item.fail{
  border-left-color:var(--fail);
}

.msg-item.error{
  border-left-color:var(--error);
}

.msg-item.log{
  border-left-color:var(--log);
}

.msg-content{
  flex:1;
}

.msg-detail{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.msg-time{
  color:var(--muted);
  font-size:10px;
}

.badge{
  padding:3px 8px;
  border-radius:4px;
  font-size:10px;
  font-family:'Space Mono',monospace;
  font-weight:700;
}

.badge-pass{
  background:rgba(0,230,118,.15);
  color:var(--pass);
}

.badge-fail{
  background:rgba(255,23,68,.15);
  color:var(--fail);
}

.badge-error{
  background:rgba(255,82,82,.15);
  color:var(--error);
}

.badge-skip{
  background:rgba(255,215,64,.15);
  color:var(--skip);
}

.collapsible{
  display:none;
}

.collapsible.open{
  display:block;
}

.screenshot-badge{
  margin-top:6px;
  display:inline-block;
  padding:4px 8px;
  border-radius:4px;
  background:rgba(124,77,255,.15);
  color:var(--accent2);
  font-size:10px;
}

#loading{
  text-align:center;
  padding:80px;
}

.spinner{
  width:48px;
  height:48px;
  border:4px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto auto 20px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

#error-msg{
  display:none;
  text-align:center;
  padding:60px;
  color:var(--fail);
}

@media(max-width:768px){
  h1{
    font-size:2rem;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Squish Automation Report</h1>
  <div class="subtitle" id="report-subtitle">
    Loading report...
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  Loading results.json...
</div>

<div id="error-msg">
  Failed to load results.json
</div>

<div id="report" style="display:none"></div>

</div>

<script>

const JSON_FILE = 'results.json';

function escHtml(s){
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmtTime(iso){
  if(!iso) return '—';

  return new Date(iso).toLocaleTimeString('en-US',{
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit',
    hour12:false
  });
}

function fmtDate(iso){
  if(!iso) return '—';

  return new Date(iso).toLocaleDateString('en-US',{
    year:'numeric',
    month:'short',
    day:'2-digit'
  });
}

function duration(start,stop){
  if(!start || !stop) return '';

  const ms = new Date(stop) - new Date(start);

  if(ms < 1000) return ms + 'ms';

  return (ms/1000).toFixed(2) + 's';
}

function toggleCollapse(id){
  const el = document.getElementById(id);

  if(!el) return;

  el.classList.toggle('open');
}

function analyzeTests(tests){

  const stats = {
    pass:0,
    fail:0,
    skip:0,
    error:0,
    log:0,
    total:0
  };

  function walk(arr){

    if(!arr) return;

    for(const t of arr){

      if(
        t.type === 'scriptedVerificationResult' ||
        t.type === 'propertyVerificationResult'
      ){

        stats.total++;

        if(t.result === 'PASS') stats.pass++;
        else if(t.result === 'FAIL') stats.fail++;
        else if(t.result === 'ERROR') stats.error++;
      }

      else if(t.type === 'msg'){

        stats.total++;

        if(t.result === 'LOG') stats.log++;
        else if(t.result === 'PASS') stats.pass++;
        else if(t.result === 'FAIL') stats.fail++;
      }

      if(t.isSkipped){
        stats.skip++;
        stats.total++;
      }

      if(t.tests) walk(t.tests);
    }
  }

  walk(tests);

  return stats;
}

function tcOverallStatus(tests){

  const s = analyzeTests(tests);

  if(s.error > 0 || s.fail > 0) return 'fail';

  if(s.skip > 0 && s.pass === 0) return 'skip';

  return 'pass';
}

function renderMessages(tests){

  const items = [];

  for(const t of tests){

    if(
      t.type === 'msg' ||
      t.type === 'scriptedVerificationResult'
    ){

      const cls =
        t.result === 'PASS' ? 'pass' :
        t.result === 'FAIL' ? 'fail' :
        t.result === 'ERROR' ? 'error' :
        'log';

      const icon =
        t.result === 'PASS' ? '✓' :
        t.result === 'FAIL' ? '✗' :
        t.result === 'ERROR' ? '⚠' :
        '›';

      items.push(`
        <li class="msg-item ${cls}">
          <div>${icon}</div>

          <div class="msg-content">

            <div>
              ${escHtml(t.text || '')}
            </div>

            ${t.detail ? `
              <div class="msg-detail">
                ${escHtml(t.detail)}
              </div>
            ` : ''}

            ${t.screenshotUrl ? `
              <div class="screenshot-badge">
                📸 Screenshot Available
              </div>
            ` : ''}

          </div>

          <div class="msg-time">
            ${fmtTime(t.time)}
          </div>
        </li>
      `);
    }
  }

  return items.length
    ? `<ul class="msg-list">${items.join('')}</ul>`
    : '';
}

function renderStep(step){

  let cls='step-skip';
  let dot='var(--skip)';
  let icon='○';

  if(step.isSkipped){
    cls='step-skip';
  }
  else{

    const msgs = step.tests || [];

    const hasError = msgs.some(m =>
      m.result === 'ERROR' ||
      m.result === 'FAIL'
    );

    const hasPass = msgs.some(m =>
      m.result === 'PASS'
    );

    if(hasError){
      cls='step-fail';
      dot='var(--fail)';
      icon='✗';
    }
    else if(hasPass){
      cls='step-pass';
      dot='var(--pass)';
      icon='✓';
    }
    else{
      cls='step-pass';
      dot='var(--log)';
      icon='›';
    }
  }

  return `
    <div class="step-item ${cls}">
      <span class="step-dot" style="background:${dot}"></span>
      <span>${icon} ${escHtml(step.name || '')}</span>
    </div>
  `;
}

function renderFeature(feat){

  let html = `
    <div class="feature-block">

      <div class="feature-header">
        ◈ Feature — ${escHtml(feat.name || '')}
      </div>
  `;

  const scenarios = (feat.tests || []).filter(t =>
    t.type === 'scenariooutline'
  );

  scenarios.forEach(sc => {

    html += `
      <div class="scenario-block">

        <div class="scenario-name">
          🧪 ${escHtml(sc.name || 'Scenario')}
        </div>
    `;

    const rows = (sc.tests || []).filter(r =>
      r.type === 'row'
    );

    rows.forEach(row => {

      html += `
        <div style="
          margin:10px 0;
          padding:10px;
          border:1px solid var(--border);
          border-radius:8px;
        ">

          <div style="
            margin-bottom:12px;
            color:var(--accent);
            font-family:'Space Mono',monospace;
          ">
            ${escHtml(row.name || '')}
          </div>
      `;

      const steps = (row.tests || []).filter(s =>
        s.type === 'step'
      );

      steps.forEach(step => {

        html += renderStep(step);

        const leafMsgs = (step.tests || []).filter(m =>
          m.type === 'msg' ||
          m.type === 'scriptedVerificationResult'
        );

        if(leafMsgs.length){
          html += renderMessages(leafMsgs);
        }
      });

      html += `</div>`;
    });

    html += `</div>`;
  });

  html += `</div>`;

  return html;
}

let tcCounter = 0;

function renderTestCase(tc){

  tcCounter++;

  const id = 'tc-' + tcCounter;

  const status = tcOverallStatus(tc.tests || []);

  const dur = duration(tc.start, tc.stop);

  let bodyHtml = '';

  for(const child of (tc.tests || [])){

    if(child.type === 'feature'){
      bodyHtml += renderFeature(child);
    }

    else if(
      child.type === 'msg' ||
      child.type === 'scriptedVerificationResult'
    ){
      bodyHtml += renderMessages([child]);
    }
  }

  return `
    <div class="testcase">

      <div class="testcase-header"
           onclick="toggleCollapse('${id}')">

        <span class="tc-status status-${status}"></span>

        <span class="tc-name">
          ${escHtml(tc.name || '')}
        </span>

        <span class="tc-duration">
          ${dur}
        </span>

        <span class="badge badge-${status}">
          ${status.toUpperCase()}
        </span>

      </div>

      <div class="testcase-body collapsible open"
           id="${id}">

        ${bodyHtml}

      </div>
    </div>
  `;
}

let suiteCounter = 0;

function renderSuite(suite){

  suiteCounter++;

  const id = 'suite-' + suiteCounter;

  const testCases = (suite.tests || []).filter(t =>
    t.type === 'testcase'
  );

  const dur = duration(suite.start, suite.stop);

  const stats = analyzeTests(suite.tests || []);

  return `
    <div class="suite-card">

      <div class="suite-header"
           onclick="toggleCollapse('${id}')">

        <div>
          <div class="suite-name">
            ${escHtml(suite.name || '')}
          </div>

          <div class="suite-meta">
            ${testCases.length} testcase(s)
            • ${dur}
          </div>
        </div>

        <div style="margin-left:auto;display:flex;gap:6px;">

          ${stats.pass ? `
            <span class="badge badge-pass">
              ${stats.pass} PASS
            </span>
          ` : ''}

          ${stats.fail ? `
            <span class="badge badge-fail">
              ${stats.fail} FAIL
            </span>
          ` : ''}

          ${stats.error ? `
            <span class="badge badge-error">
              ${stats.error} ERR
            </span>
          ` : ''}

          ${stats.skip ? `
            <span class="badge badge-skip">
              ${stats.skip} SKIP
            </span>
          ` : ''}

        </div>
      </div>

      <div class="suite-body collapsible open"
           id="${id}">

        ${testCases.map(renderTestCase).join('')}

      </div>
    </div>
  `;
}

function renderReport(data){

  const suites = (data.tests || []).filter(t =>
    t.type === 'testsuite'
  );

  const allTests = [];

  suites.forEach(s =>
    (s.tests || []).forEach(tc => {
      if(tc.type === 'testcase'){
        allTests.push(tc);
      }
    })
  );

  let totalPass=0;
  let totalFail=0;
  let totalSkip=0;
  let totalError=0;

  allTests.forEach(tc => {

    const s = analyzeTests(tc.tests || []);

    totalPass += s.pass;
    totalFail += s.fail;
    totalSkip += s.skip;
    totalError += s.error;
  });

  const totalEvents =
    totalPass +
    totalFail +
    totalSkip +
    totalError;

  const passRate = totalEvents
    ? Math.round((totalPass / totalEvents) * 100)
    : 0;

  const start = suites[0]?.start;

  document.getElementById('report-subtitle').textContent =
    `${fmtDate(start)} • ${fmtTime(start)} • Squish v${data.version.major}.${data.version.minor}`;

  const html = `

    <div class="summary-grid">

      <div class="stat-card total">
        <div class="stat-num">${totalEvents}</div>
        <div class="stat-label">Total</div>
      </div>

      <div class="stat-card passed">
        <div class="stat-num">${totalPass}</div>
        <div class="stat-label">Passed</div>
      </div>

      <div class="stat-card failed">
        <div class="stat-num">${totalFail}</div>
        <div class="stat-label">Failed</div>
      </div>

      <div class="stat-card skipped">
        <div class="stat-num">${totalSkip}</div>
        <div class="stat-label">Skipped</div>
      </div>

      <div class="stat-card errors">
        <div class="stat-num">${totalError}</div>
        <div class="stat-label">Errors</div>
      </div>

    </div>

    <div class="progress-section">

      <div class="progress-label">

        <div class="progress-title">
          Pass Rate
        </div>

        <div class="progress-pct">
          ${passRate}%
        </div>

      </div>

      <div class="progress-bar">

        <div class="progress-fill pass"
             style="width:${totalPass/totalEvents*100}%"></div>

        <div class="progress-fill fail"
             style="width:${totalFail/totalEvents*100}%"></div>

        <div class="progress-fill skip"
             style="width:${totalSkip/totalEvents*100}%"></div>

      </div>

    </div>

    <div class="section-title">
      Test Suites
    </div>

    ${suites.map(renderSuite).join('')}

  `;

  const report = document.getElementById('report');

  report.innerHTML = html;

  document.getElementById('loading').style.display='none';

  report.style.display='block';
}

async function loadReport(){

  try{

    const res = await fetch(JSON_FILE);

    if(!res.ok){
      throw new Error('Failed');
    }

    const data = await res.json();

    renderReport(data);

  }
  catch(err){

    console.error(err);

    document.getElementById('loading').style.display='none';

    document.getElementById('error-msg').style.display='block';
  }
}

loadReport();

</script>

</body>
</html>
