<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squish Automation Report</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0a0d14;
  --surface:#111622;
  --surface2:#161d2e;
  --border:#1e2a3f;

  --accent:#00e5ff;
  --accent2:#7c4dff;

  --pass:#00e676;
  --fail:#ff1744;
  --skip:#ffd740;
  --error:#ff5252;
  --log:#40c4ff;

  --text:#e2e8f0;
  --muted:#546e8a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;

  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);

  background-size:40px 40px;

  pointer-events:none;
}

.container{
  max-width:1300px;
  margin:auto;
  padding:40px 20px 80px;
}

header{
  text-align:center;
  margin-bottom:40px;
}

.logo-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;

  border:1px solid rgba(0,229,255,0.3);

  padding:8px 16px;

  color:var(--accent);

  font-size:11px;

  border-radius:4px;

  font-family:'Space Mono',monospace;

  letter-spacing:3px;

  margin-bottom:25px;
}

.logo-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
}

h1{
  font-size:clamp(2rem,5vw,4rem);
  font-weight:800;

  background:linear-gradient(
    135deg,
    #ffffff,
    var(--accent),
    var(--accent2)
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin-bottom:12px;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-family:'Space Mono',monospace;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
  margin-bottom:30px;
}

.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;

  padding:24px;

  text-align:center;
}

.stat-num{
  font-size:3rem;
  font-weight:800;
  font-family:'Space Mono',monospace;
}

.stat-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:6px;
}

.total .stat-num{color:var(--accent);}
.pass .stat-num{color:var(--pass);}
.fail .stat-num{color:var(--fail);}
.skip .stat-num{color:var(--skip);}
.error .stat-num{color:var(--error);}

.chart-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:30px;
  margin-bottom:30px;

  display:flex;
  align-items:center;
  gap:40px;
  flex-wrap:wrap;
}

.chart-title{
  width:100%;
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:3px;
}

.donut-wrap{
  position:relative;
  width:220px;
  height:220px;
}

.donut-wrap svg{
  transform:rotate(-90deg);
}

.donut-center{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.donut-pct{
  font-size:2.2rem;
  font-weight:800;
  color:var(--pass);
  font-family:'Space Mono',monospace;
}

.donut-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:2px;
}

.chart-legend{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:10px;
}

.legend-dot{
  width:12px;
  height:12px;
  border-radius:50%;
}

.legend-label{
  font-size:13px;
}

.legend-value{
  margin-left:auto;
  font-family:'Space Mono',monospace;
  font-weight:700;
}

.section-title{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:3px;
  color:var(--muted);
  margin-bottom:16px;
}

.suite-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:20px;
}

.suite-header{
  background:var(--surface2);
  padding:18px 22px;

  display:flex;
  align-items:center;
  gap:12px;

  cursor:pointer;
}

.suite-name{
  font-weight:700;
  font-family:'Space Mono',monospace;
}

.suite-body{
  padding:18px;
}

.testcase{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:14px;
}

.testcase-header{
  padding:14px 18px;
  background:#161d2e;

  display:flex;
  align-items:center;
  gap:12px;

  cursor:pointer;
}

.tc-status{
  width:10px;
  height:10px;
  border-radius:50%;
}

.status-pass{
  background:var(--pass);
}

.status-fail{
  background:var(--fail);
}

.status-skip{
  background:var(--skip);
}

.tc-name{
  flex:1;
  font-size:13px;
  font-family:'Space Mono',monospace;
}

.badge{
  font-size:10px;
  padding:4px 8px;
  border-radius:4px;
  font-family:'Space Mono',monospace;
}

.badge-pass{
  background:rgba(0,230,118,0.15);
  color:var(--pass);
}

.badge-fail{
  background:rgba(255,23,68,0.15);
  color:var(--fail);
}

.badge-skip{
  background:rgba(255,215,64,0.15);
  color:var(--skip);
}

.testcase-body{
  padding:16px;
}

.msg-list{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg-item{
  background:#141b2a;
  border-left:4px solid var(--border);

  padding:12px;
  border-radius:6px;

  font-size:12px;
  font-family:'Space Mono',monospace;
}

.msg-item.pass{
  border-left-color:var(--pass);
}

.msg-item.fail{
  border-left-color:var(--fail);
}

.msg-item.log{
  border-left-color:var(--log);
}

.msg-item.error{
  border-left-color:var(--error);
}

.msg-text{
  line-height:1.5;
}

.collapsible{
  display:none;
}

.collapsible.open{
  display:block;
}

#loading{
  text-align:center;
  padding:120px 40px;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid var(--border);
  border-top-color:var(--accent);

  border-radius:50%;

  margin:auto auto 20px;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#error-msg{
  display:none;
  text-align:center;
  padding:80px;
}

.error-box{
  display:inline-block;
  background:rgba(255,23,68,0.1);
  border:1px solid rgba(255,23,68,0.3);
  color:var(--fail);

  padding:24px;
  border-radius:10px;

  font-family:'Space Mono',monospace;
}

#report{
  display:none;
}

@media(max-width:700px){

  .summary-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>
<body>

<div class="container">

<header>

<div class="logo-tag">
<span class="logo-dot"></span>
SQUISH AUTOMATION REPORT
</div>

<h1>Test Execution Results</h1>

<p class="subtitle" id="report-subtitle">
Loading report...
</p>

</header>

<div id="loading">

<div class="spinner"></div>

Loading report...

</div>

<div id="error-msg">

<div class="error-box">

Failed to load results.json

</div>

</div>

<div id="report"></div>

</div>

<script>

const JSON_FILE='results.json';

function escHtml(s){

  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function toggleCollapse(id){

  const el=document.getElementById(id);

  if(!el) return;

  el.classList.toggle('open');
}

function fmtDate(d){

  return new Date(d).toLocaleString();
}

function analyzeTests(tests){

  const stats={
    pass:0,
    fail:0,
    skip:0,
    error:0
  };

  function walk(arr){

    if(!arr) return;

    for(const t of arr){

      if(t.result==='PASS') stats.pass++;
      else if(t.result==='FAIL') stats.fail++;
      else if(t.result==='ERROR') stats.error++;
      else if(t.isSkipped) stats.skip++;

      if(t.tests) walk(t.tests);
    }
  }

  walk(tests);

  return stats;
}

function drawDonut(pass,fail,skip,error,total){

  if(total===0) return;

  const r=80;
  const c=2*Math.PI*r;

  const segments=[
    {id:'seg-pass',val:pass,color:'#00e676'},
    {id:'seg-fail',val:fail,color:'#ff1744'},
    {id:'seg-error',val:error,color:'#ff5252'},
    {id:'seg-skip',val:skip,color:'#ffd740'}
  ];

  let offset=0;

  segments.forEach(seg=>{

    const el=document.getElementById(seg.id);

    if(!el || seg.val<=0) return;

    const dash=(seg.val/total)*c;

    el.setAttribute(
      'stroke-dasharray',
      `${dash} ${c-dash}`
    );

    el.setAttribute(
      'stroke-dashoffset',
      -offset
    );

    el.setAttribute(
      'stroke',
      seg.color
    );

    offset+=dash;
  });
}

function renderReport(data){

  const suites=(data.tests || []);

  let totalPass=0;
  let totalFail=0;
  let totalSkip=0;
  let totalError=0;

  suites.forEach(s=>{

    const stats=analyzeTests(s.tests);

    totalPass+=stats.pass;
    totalFail+=stats.fail;
    totalSkip+=stats.skip;
    totalError+=stats.error;
  });

  const totalEvents=
    totalPass+
    totalFail+
    totalSkip+
    totalError;

  const passRate=
    totalEvents
      ? Math.round((totalPass/totalEvents)*100)
      : 0;

  document.getElementById('report-subtitle').textContent=
    fmtDate(suites[0]?.start);

  let html=`

  <div class="summary-grid">

    <div class="stat-card total">
      <div class="stat-num">${totalEvents}</div>
      <div class="stat-label">Total</div>
    </div>

    <div class="stat-card pass">
      <div class="stat-num">${totalPass}</div>
      <div class="stat-label">Passed</div>
    </div>

    <div class="stat-card fail">
      <div class="stat-num">${totalFail}</div>
      <div class="stat-label">Failed</div>
    </div>

    <div class="stat-card skip">
      <div class="stat-num">${totalSkip}</div>
      <div class="stat-label">Skipped</div>
    </div>

    <div class="stat-card error">
      <div class="stat-num">${totalError}</div>
      <div class="stat-label">Errors</div>
    </div>

  </div>

  <div class="chart-section">

    <div class="chart-title">
      Result Breakdown
    </div>

    <div class="donut-wrap">

      <svg width="220" height="220" viewBox="0 0 220 220">

        <circle
          cx="110"
          cy="110"
          r="80"
          fill="none"
          stroke="#1e2a3f"
          stroke-width="24"
        />

        <circle id="seg-pass" cx="110" cy="110" r="80" fill="none" stroke-width="24"/>
        <circle id="seg-fail" cx="110" cy="110" r="80" fill="none" stroke-width="24"/>
        <circle id="seg-error" cx="110" cy="110" r="80" fill="none" stroke-width="24"/>
        <circle id="seg-skip" cx="110" cy="110" r="80" fill="none" stroke-width="24"/>

      </svg>

      <div class="donut-center">

        <div class="donut-pct">
          ${passRate}%
        </div>

        <div class="donut-label">
          PASS RATE
        </div>

      </div>

    </div>

    <div class="chart-legend">

      <div class="legend-item">
        <div class="legend-dot" style="background:#00e676"></div>
        <div class="legend-label">Passed</div>
        <div class="legend-value">${totalPass}</div>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#ff1744"></div>
        <div class="legend-label">Failed</div>
        <div class="legend-value">${totalFail}</div>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#ff5252"></div>
        <div class="legend-label">Errors</div>
        <div class="legend-value">${totalError}</div>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:#ffd740"></div>
        <div class="legend-label">Skipped</div>
        <div class="legend-value">${totalSkip}</div>
      </div>

    </div>

  </div>

  <div class="section-title">
    Test Suites
  </div>
  `;

  let suiteId=0;

  suites.forEach(suite=>{

    suiteId++;

    html+=`

    <div class="suite-card">

      <div class="suite-header"
           onclick="toggleCollapse('suite-${suiteId}')">

        <div class="suite-name">
          ${escHtml(suite.name)}
        </div>

      </div>

      <div class="suite-body collapsible open"
           id="suite-${suiteId}">
    `;

    let tcId=0;

    (suite.tests || []).forEach(tc=>{

      tcId++;

      const stats=analyzeTests(tc.tests);

      const status=
        stats.fail || stats.error
          ? 'fail'
          : 'pass';

      html+=`

      <div class="testcase">

        <div class="testcase-header"
             onclick="toggleCollapse('tc-${suiteId}-${tcId}')">

          <div class="tc-status status-${status}"></div>

          <div class="tc-name">
            ${escHtml(tc.name)}
          </div>

          <div class="badge badge-${status}">
            ${status.toUpperCase()}
          </div>

        </div>

        <div class="testcase-body collapsible open"
             id="tc-${suiteId}-${tcId}">

          <ul class="msg-list">
      `;

      function collect(arr){

        if(!arr) return;

        arr.forEach(t=>{

          if(t.result){

            html+=`

            <li class="msg-item ${t.result.toLowerCase()}">

              <div class="msg-text">

                ${escHtml(t.text || t.name)}

              </div>

            </li>
            `;
          }

          if(t.tests) collect(t.tests);
        });
      }

      collect(tc.tests);

      html+=`
          </ul>
        </div>
      </div>
      `;
    });

    html+=`
      </div>
    </div>
    `;
  });

  const report=document.getElementById('report');

  report.innerHTML=html;

  document.getElementById('loading').style.display='none';

  report.style.display='block';

  setTimeout(()=>{

    drawDonut(
      totalPass,
      totalFail,
      totalSkip,
      totalError,
      totalEvents
    );

  },100);
}

async function loadReport(){

  try{

    const res=await fetch(JSON_FILE);

    if(!res.ok)
      throw new Error('Failed');

    const data=await res.json();

    renderReport(data);

  }catch(err){

    console.error(err);

    document.getElementById('loading').style.display='none';

    document.getElementById('error-msg').style.display='block';
  }
}

loadReport();

</script>

</body>
</html>
