<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no"/>
<title>Xray · CSV Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"/>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root {
  --void: #050508;
  --deep: #080b14;
  --well: #0d1120;
  --surface: #121828;
  --panel: #171f32;
  --rim: #1e2940;
  --stroke: rgba(255,255,255,0.06);
  --stroke2: rgba(255,255,255,0.11);
  --stroke3: rgba(255,255,255,0.18);

  --acid: #d4ff47;
  --acid2: #b8e800;
  --neon: #00ffc8;
  --violet: #8b5cf6;
  --violet2: #6d43d4;
  --magenta: #f046b0;
  --amber: #ffaa00;
  --sky: #38c4ff;

  --ink: #e8edf8;
  --ink2: #9aa5be;
  --ink3: #5a6480;
  --ink4: #323a52;

  --ff-head: 'Syne', sans-serif;
  --ff-body: 'Syne', sans-serif;
  --ff-mono: 'JetBrains Mono', monospace;
  --ff-serif: 'Instrument Serif', serif;

  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --r: 16px;
  --r2: 24px;
}

/* ═══════════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }

html, body {
  background: var(--void) !important;
  color: var(--ink);
  font-family: var(--ff-body);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════
   CANVAS BACKGROUND LAYER
═══════════════════════════════════════════════ */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════
   GRID + NOISE OVERLAY
═══════════════════════════════════════════════ */
#grid-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(212,255,71,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,255,71,0.025) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
}

/* ═══════════════════════════════════════════════
   FLOATING ORBS
═══════════════════════════════════════════════ */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(80px);
  opacity: 0;
  animation: orbIn 2s var(--ease-out) forwards, drift linear infinite;
}
.orb-a {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%);
  top: -200px; left: -200px;
  animation-delay: 0.2s, 2.2s;
  animation-duration: 2s, 28s;
}
.orb-b {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(212,255,71,0.13) 0%, transparent 70%);
  bottom: -150px; right: -100px;
  animation-delay: 0.5s, 2.5s;
  animation-duration: 2s, 22s;
  animation-direction: normal, reverse;
}
.orb-c {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0,255,200,0.08) 0%, transparent 70%);
  top: 50%; left: 55%;
  animation-delay: 0.8s, 2.8s;
  animation-duration: 2s, 35s;
}
@keyframes orbIn { to { opacity: 1 } }
@keyframes drift {
  0%,100% { transform: translate(0,0) scale(1) }
  25%      { transform: translate(30px,-40px) scale(1.05) }
  50%      { transform: translate(-20px,30px) scale(0.96) }
  75%      { transform: translate(40px,20px) scale(1.03) }
}

/* ═══════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════ */
#topbar {
  position: relative;
  z-index: 100;
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 20px;
  background: rgba(5,5,8,0.7);
  backdrop-filter: blur(32px) saturate(1.6);
  border-bottom: 1px solid var(--stroke);
  flex-shrink: 0;
  opacity: 0;
  transform: translateY(-100%);
  animation: barDown 0.8s var(--ease-out) 0.3s forwards;
}

/* Animated accent line */
#topbar::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--violet) 20%,
    var(--acid) 50%,
    var(--neon) 80%,
    transparent 100%);
  opacity: 0.6;
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
}

@keyframes barDown { to { opacity:1; transform:translateY(0) } }
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

/* Logo */
.logo-gem {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--violet2), var(--acid));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(139,92,246,0.4);
}
.logo-gem::before {
  content: '';
  position: absolute;
  inset: 0;
  background: conic-gradient(from 0deg, transparent 55%, rgba(255,255,255,0.3) 65%, transparent 75%);
  animation: gemSpin 3s linear infinite;
}
.logo-gem svg { position: relative; z-index: 1 }
@keyframes gemSpin { to { transform: rotate(360deg) } }

.logo-text {
  font-family: var(--ff-head);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #fff 30%, var(--acid));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bar-divider { width: 1px; height: 24px; background: var(--stroke2) }

.bar-label {
  font-family: var(--ff-mono);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink4);
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--stroke);
  border-radius: 100px;
  padding: 4px 12px;
}

.bar-spacer { flex: 1 }

/* Status pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--ff-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid;
  opacity: 0;
  animation: pillPop 0.5s var(--ease-spring) forwards;
}
.pill-green {
  background: rgba(0,255,200,0.06);
  color: var(--neon);
  border-color: rgba(0,255,200,0.2);
  animation-delay: 0.7s;
}
.pill-violet {
  background: rgba(139,92,246,0.06);
  color: #a78bfa;
  border-color: rgba(139,92,246,0.2);
  animation-delay: 0.85s;
}
.pill-dim {
  background: rgba(90,100,128,0.06);
  color: var(--ink3);
  border-color: rgba(90,100,128,0.15);
  animation-delay: 1s;
}
.pill-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  animation: blink 2s ease-in-out infinite;
}
@keyframes pillPop { from { opacity:0; transform:scale(0.6) translateY(4px) } to { opacity:1; transform:scale(1) translateY(0) } }
@keyframes blink { 0%,100% { opacity:0.3 } 50% { opacity:1 } }

/* ═══════════════════════════════════════════════
   CORNER DECORATIONS
═══════════════════════════════════════════════ */
.corner-dec {
  position: fixed;
  width: 28px; height: 28px;
  z-index: 50;
  opacity: 0;
  animation: fadeIn 0.5s ease 1.2s forwards;
}
@keyframes fadeIn { to { opacity:0.5 } }
.c-tl { top:76px; left:16px; border-top:1.5px solid var(--acid); border-left:1.5px solid var(--acid) }
.c-tr { top:76px; right:16px; border-top:1.5px solid var(--acid); border-right:1.5px solid var(--acid) }
.c-bl { bottom:44px; left:16px; border-bottom:1.5px solid var(--acid); border-left:1.5px solid var(--acid) }
.c-br { bottom:44px; right:16px; border-bottom:1.5px solid var(--acid); border-right:1.5px solid var(--acid) }

/* ═══════════════════════════════════════════════
   MAIN CONTENT AREA
═══════════════════════════════════════════════ */
#root {
  position: relative;
  z-index: 10;
  min-height: calc(100vh - 100px);
}

/* ═══════════════════════════════════════════════
   STREAMLIT RESETS — DEEP DARK
═══════════════════════════════════════════════ */
.stApp,
[data-testid="stAppViewContainer"],
[data-testid="stMain"],
[data-testid="stMainBlockContainer"],
[data-testid="stVerticalBlock"],
[data-testid="stVerticalBlockBorderWrapper"],
[data-testid="stHorizontalBlock"],
[data-testid="stColumn"],
[data-testid="stElementContainer"],
.block-container,
.appview-container,
.withScreencast,
section[data-testid="stMain"],
.st-emotion-cache-1r4qj8v,
.st-emotion-cache-bm2z3a,
.st-emotion-cache-zy6yx3,
.st-emotion-cache-1yiq2ps {
  background: transparent !important;
  background-color: transparent !important;
}
.stApp { background: transparent !important }
.stApp > header, .stDeployButton, [data-testid="stHeader"] { display: none !important }

.block-container {
  padding: 2.5rem 3rem 5rem !important;
  max-width: 100% !important;
}

/* Sidebar */
section[data-testid="stSidebar"] {
  background: rgba(8,11,20,0.96) !important;
  border-right: 1px solid var(--stroke) !important;
  backdrop-filter: blur(20px) !important;
}
section[data-testid="stSidebar"]::before {
  content: '';
  position: absolute;
  top: 0; right: -1px; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--violet), var(--acid), transparent);
  opacity: 0.4;
}

/* ─── Headings ─── */
[data-testid="stMarkdownContainer"] h1,
[data-testid="stMarkdownContainer"] h2,
[data-testid="stMarkdownContainer"] h3 {
  color: var(--ink) !important;
  font-family: var(--ff-head) !important;
}
[data-testid="stMarkdownContainer"] p {
  color: var(--ink2) !important;
}

/* ─── File uploader ─── */
[data-testid="stFileUploader"] > section,
[data-testid="stFileUploaderDropzone"] {
  border: 1.5px dashed rgba(139,92,246,0.25) !important;
  background: rgba(8,11,20,0.8) !important;
  border-radius: 20px !important;
  transition: all 0.4s var(--ease-spring) !important;
  backdrop-filter: blur(16px) !important;
  position: relative !important;
  overflow: hidden !important;
}
[data-testid="stFileUploader"] > section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.08) 0%, transparent 60%);
  pointer-events: none;
}
[data-testid="stFileUploader"] > section:hover {
  border-color: rgba(212,255,71,0.5) !important;
  background: rgba(212,255,71,0.03) !important;
  transform: translateY(-4px) scale(1.005) !important;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,255,71,0.1), inset 0 1px 0 rgba(212,255,71,0.08) !important;
}
[data-testid="stFileUploaderDropzoneInstructions"] *,
[data-testid="stFileUploader"] > section * { color: var(--ink3) !important }
[data-testid="stFileUploaderFile"] { background: rgba(13,17,32,0.9) !important }
[data-testid="stFileUploaderFileName"] { color: var(--ink) !important }

/* ─── Browse / secondary buttons ─── */
button[data-testid="stBaseButton-secondary"] {
  background: rgba(5,5,8,0.9) !important;
  color: var(--ink2) !important;
  border: 1px solid var(--stroke2) !important;
  border-radius: 10px !important;
  font-family: var(--ff-body) !important;
  transition: all 0.2s ease !important;
}
button[data-testid="stBaseButton-secondary"]:hover {
  background: rgba(139,92,246,0.08) !important;
  border-color: rgba(139,92,246,0.4) !important;
  color: var(--ink) !important;
  transform: translateY(-1px) !important;
}

/* ─── Metrics ─── */
[data-testid="metric-container"] {
  background: linear-gradient(135deg, rgba(13,17,32,0.95), rgba(8,11,20,0.9)) !important;
  border: 1px solid var(--stroke) !important;
  border-radius: 18px !important;
  padding: 1.2rem 1.4rem !important;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s ease !important;
  animation: metricIn 0.5s var(--ease-out) both;
  backdrop-filter: blur(20px) !important;
}
[data-testid="metric-container"]::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,255,71,0.6), transparent);
  animation: scanLine 4s ease-in-out infinite;
}
[data-testid="metric-container"]::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.06), transparent 60%);
  pointer-events: none;
}
@keyframes scanLine { 0%,100% { opacity:0.2 } 50% { opacity:1 } }
@keyframes metricIn { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }
[data-testid="metric-container"]:hover {
  transform: translateY(-6px) scale(1.03) !important;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,255,71,0.15) !important;
}
[data-testid="stMetricLabel"] p {
  font-family: var(--ff-mono) !important;
  font-size: 9px !important;
  letter-spacing: 2px !important;
  text-transform: uppercase !important;
  color: var(--ink4) !important;
}
[data-testid="stMetricValue"],
[data-testid="stMetricValue"] div {
  font-family: var(--ff-head) !important;
  font-size: 2rem !important;
  font-weight: 800 !important;
  color: var(--acid) !important;
  background: transparent !important;
  animation: valPop 0.7s var(--ease-spring) both;
}
@keyframes valPop { from { opacity:0; transform:scale(0.7) translateY(8px) } to { opacity:1; transform:scale(1) translateY(0) } }

/* ─── Primary buttons ─── */
.stButton > button {
  background: linear-gradient(135deg, rgba(212,255,71,0.08), rgba(139,92,246,0.08)) !important;
  color: var(--ink) !important;
  border: 1px solid rgba(212,255,71,0.22) !important;
  border-radius: 12px !important;
  font-family: var(--ff-body) !important;
  font-weight: 600 !important;
  font-size: 13px !important;
  padding: 0.6rem 1.5rem !important;
  letter-spacing: 0.3px !important;
  transition: all 0.25s ease !important;
  backdrop-filter: blur(8px) !important;
}
.stButton > button:hover {
  background: linear-gradient(135deg, rgba(212,255,71,0.16), rgba(139,92,246,0.16)) !important;
  border-color: rgba(212,255,71,0.55) !important;
  transform: translateY(-2px) !important;
  box-shadow: 0 10px 40px rgba(212,255,71,0.12), 0 0 0 1px rgba(212,255,71,0.1) !important;
  color: var(--acid) !important;
}
[data-testid="stDownloadButton"] > button {
  background: linear-gradient(135deg, rgba(0,255,200,0.08), rgba(212,255,71,0.05)) !important;
  border-color: rgba(0,255,200,0.25) !important;
  color: var(--neon) !important;
}
[data-testid="stDownloadButton"] > button:hover {
  background: linear-gradient(135deg, rgba(0,255,200,0.16), rgba(212,255,71,0.1)) !important;
  border-color: rgba(0,255,200,0.5) !important;
  box-shadow: 0 10px 40px rgba(0,255,200,0.12) !important;
}

/* ─── Select / multiselect ─── */
[data-testid="stSelectbox"] > div > div {
  background: var(--well) !important;
  border-color: var(--rim) !important;
  color: var(--ink) !important;
  border-radius: 12px !important;
}
[data-testid="stMultiSelect"] > div {
  background: var(--well) !important;
  border-color: var(--rim) !important;
  border-radius: 12px !important;
}

/* ─── Radio buttons ─── */
[data-testid="stRadio"] > div {
  gap: 6px !important;
  flex-wrap: wrap !important;
}
[data-testid="stRadio"] label {
  background: rgba(5,5,8,0.9) !important;
  border: 1px solid var(--stroke) !important;
  border-radius: 12px !important;
  padding: 6px 16px !important;
  cursor: pointer !important;
  transition: all 0.2s ease !important;
  font-size: 12px !important;
  font-weight: 500 !important;
  color: var(--ink3) !important;
  backdrop-filter: blur(8px) !important;
}
[data-testid="stRadio"] label:hover {
  border-color: rgba(212,255,71,0.4) !important;
  color: var(--acid) !important;
  background: rgba(212,255,71,0.04) !important;
  transform: translateY(-1px) !important;
}

/* ─── Alerts ─── */
[data-testid="stAlert"] {
  border-radius: 16px !important;
  border-left-width: 3px !important;
  background: rgba(139,92,246,0.06) !important;
  border-color: var(--violet) !important;
  font-size: 13px !important;
  backdrop-filter: blur(12px) !important;
}

/* ─── Dataframe ─── */
[data-testid="stDataFrame"] {
  border: 1px solid var(--stroke) !important;
  border-radius: 16px !important;
  overflow: hidden !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3) !important;
}

/* ─── Success message ─── */
.st-success, [data-testid="stAlert"][kind="success"] {
  background: rgba(0,255,200,0.05) !important;
  border-color: var(--neon) !important;
}

/* ─── Sidebar widgets ─── */
section[data-testid="stSidebar"] [data-testid="stSelectbox"] > div > div {
  background: rgba(13,17,32,0.9) !important;
  border-color: var(--rim) !important;
}

/* ─── Divider ─── */
hr {
  border: none !important;
  height: 1px !important;
  background: linear-gradient(90deg, transparent, var(--stroke2), transparent) !important;
  margin: 1.5rem 0 !important;
}

/* ═══════════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════════ */
#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.8rem;
  transition: opacity 1s ease, visibility 1s ease;
}
#loading.gone { opacity:0; visibility:hidden }

.load-ring {
  width: 72px; height: 72px;
  position: relative;
  animation: spin 1.4s linear infinite;
}
.load-ring::before,
.load-ring::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 2.5px solid transparent;
}
.load-ring::before {
  inset: 0;
  border-top-color: var(--violet);
  border-right-color: var(--acid);
  animation: none;
}
.load-ring::after {
  inset: 10px;
  border-bottom-color: var(--neon);
  border-left-color: var(--magenta);
  animation: spin 2.1s linear infinite reverse;
}
@keyframes spin { to { transform: rotate(360deg) } }

.load-wordmark {
  font-family: var(--ff-head);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 6px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--ink), var(--acid));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:0.6 } 50% { opacity:1 } }

.load-sub {
  font-family: var(--ff-mono);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink4);
  margin-top: -1rem;
}

.load-progress {
  width: 280px;
  height: 2px;
  background: rgba(255,255,255,0.05);
  border-radius: 2px;
  overflow: hidden;
}
.load-bar {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--violet), var(--acid), var(--neon));
  animation: barFill 6s var(--ease-out) 0.5s forwards;
  background-size: 200% 100%;
  animation: barFill 6s ease 0.5s forwards, barShimmer 2s linear infinite;
}
@keyframes barFill { to { width: 100% } }
@keyframes barShimmer { 0% { background-position:200% 0 } 100% { background-position:-200% 0 } }

/* ═══════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════ */
#footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 24px;
  background: rgba(5,5,8,0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--stroke);
  opacity: 0;
  animation: fadeIn 0.6s ease 1.4s forwards;
}
#footer::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--violet), transparent);
  opacity: 0.3;
}
.fi {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--ff-mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;

<!-- Particle canvas script -->
<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function randomParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.4 + 0.05,
      hue: Math.random() > 0.6 ? 80 : (Math.random() > 0.5 ? 265 : 170),
    };
  }

  function init() {
    resize();
    particles = Array.from({length: 80}, randomParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.alpha})`;
      ctx.fill();
    });

    // Draw soft connection lines
    particles.forEach((a, i) => {
      particles.slice(i+1).forEach(b => {
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(139,92,246,${0.06 * (1 - d/120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      });
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>
